<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambedkar Public School - Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        .topHeader {
            background: #ffcc00;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 15px;
            border-bottom: 2px solid #e6b800;
            height: 70px;
            flex-shrink: 0;
            z-index: 100;
        }
        .headerLeft { display: flex; align-items: center; gap: 12px; }
        
        /* SIDEBAR TOGGLE BUTTON */
        .toggleBtn {
            background: #0b3c5d;
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .toggleBtn:hover { background: #07273d; }

        .schoolBrand { display: flex; align-items: center; gap: 12px; }
        .schoolLogo { width: 50px; height: 50px; object-fit: contain; flex-shrink: 0; }
        .schoolInfo h1 { font-size: 18px; color: #0b3c5d; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; line-height: 1.1; }
        .schoolInfo div { font-size: 11px; color: #333; font-weight: 500; }

        .adminMeta { text-align: right; }
        .adminMeta h3 { font-size: 12px; color: #0b3c5d; font-weight: bold; }
        .adminMeta div { font-size: 10.5px; color: #444; }

        /* BODY LAYOUT */
        .portalLayout { display: flex; flex: 1; height: calc(100vh - 70px); overflow: hidden; position: relative; }

        /* SIDEBAR */
        .sidebar {
            width: 230px;
            background: #071b46;
            color: #fff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
            z-index: 90;
        }
        
        /* SIDEBAR COLLAPSED (DESKTOP) */
        .sidebar.collapsed {
            margin-left: -230px;
        }

        .sidebarMenu { list-style: none; padding: 10px 0; }
        .menuItem {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            cursor: pointer;
            color: #cfd9df;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .menuItem:hover, .menuItem.active { background: #0c2b6d; color: #fff; border-left-color: #ffcc00; }

        /* MAIN CONTENT AREA */
        .mainArea { flex: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; }
        .moduleTopBar {
            background: #fff;
            padding: 12px 20px;
            font-size: 17px;
            font-weight: 700;
            color: #0b3c5d;
            border-bottom: 1px solid #dfe3e8;
            flex-shrink: 0;
        }
        .moduleContainer { flex: 1; padding: 15px; overflow-y: auto; position: relative; }

        /* BACKDROP FOR MOBILE */
        .sidebarOverlay {
            position: fixed;
            top: 70px; left: 0; width: 100%; height: calc(100vh - 70px);
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 80;
        }

        .pageLoader {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(255,255,255,0.7); display: none;
            align-items: center; justify-content: center; font-weight: bold; color: #0b3c5d;
            z-index: 50;
        }

        /* RESPONSIVE CSS (MOBILE & TABLET) */
        @media (max-width: 768px) {
            .adminMeta { display: none; } /* मोबाइल पर गैर-जरूरी टेक्स्ट छुपाएं */
            .schoolInfo h1 { font-size: 15px; }
            .schoolInfo div:nth-child(3) { display: none; } /* फोन/ईमेल लाइन छुपाएं */
            
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                box-shadow: 2px 0 10px rgba(0,0,0,0.3);
                transform: translateX(-100%);
                margin-left: 0 !important;
            }

            .sidebar.mobileOpen {
                transform: translateX(0);
            }

            .sidebarOverlay.active {
                display: block;
            }

            .moduleContainer { padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- HEADER WITH TOGGLE BUTTON -->
    <div class="topHeader">
        <div class="headerLeft">
            <button class="toggleBtn" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
            <div class="schoolBrand">
                <img src="https://i.postimg.cc/pLt1F2cD/logo-copy.png" class="schoolLogo" alt="Logo">
                <div class="schoolInfo">
                    <h1>Ambedkar Public School</h1>
                    <div>Madhopur Campierganj Gorakhpur | UDISE: 9584109512</div>
                    <div>Mobile: 9793458774 | Session: 2026-2027</div>
                </div>
            </div>
        </div>
        <div class="adminMeta">
            <h3>SCHOOL ADMINISTRATOR</h3>
            <div>ADMIN | Active Portal</div>
        </div>
    </div>

    <!-- MAIN BODY -->
    <div class="portalLayout">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <ul class="sidebarMenu">
                <li class="menuItem active" onclick="navigateModule('dashboard', 'Dashboard')">📊 Dashboard</li>
                <li class="menuItem" onclick="navigateModule('admission', 'New Admission')">📝 New Admission</li>
                <li class="menuItem" onclick="navigateModule('manage-students', 'Manage Students')">👥 Manage Students</li>
            </ul>
        </div>

        <!-- MOBILE OVERLAY -->
        <div class="sidebarOverlay" id="sidebarOverlay" onclick="closeSidebarOnMobile()"></div>

        <!-- WORKSPACE -->
        <div class="mainArea">
            <div class="moduleTopBar" id="moduleTitle">Dashboard</div>
            <div class="moduleContainer" id="moduleContent"></div>
            <div id="loader" class="pageLoader">Loading Module...</div>
        </div>
    </div>

    <!-- CONFIGURATION -->
    <script src="config.js"></script>

    <script>
        // साइडबार टॉगल (डेस्कटॉप व मोबाइल फ्रेंडली)
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");

            if (window.innerWidth <= 768) {
                sidebar.classList.toggle("mobileOpen");
                overlay.classList.toggle("active");
            } else {
                sidebar.classList.toggle("collapsed");
            }
        }

        function closeSidebarOnMobile() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");
            sidebar.classList.remove("mobileOpen");
            overlay.classList.remove("active");
        }

        // डायनेमिक फ़ाइल लोडर
        function navigateModule(fileKey, titleText) {
            document.getElementById("moduleTitle").innerText = titleText;

            // एक्टिव क्लास बदलना
            document.querySelectorAll(".sidebarMenu .menuItem").forEach(item => {
                item.classList.remove("active");
                if (item.innerText.includes(titleText)) item.classList.add("active");
            });

            // मोबाइल पर मॉड्यूल चुनने के बाद साइडबार स्वतः बंद हो
            if (window.innerWidth <= 768) {
                closeSidebarOnMobile();
            }

            const contentDiv = document.getElementById("moduleContent");
            const loader = document.getElementById("loader");
            loader.style.display = "flex";

            fetch(`${fileKey}.html`)
            .then(res => {
                if (!res.ok) throw new Error("फ़ाइल लोड नहीं हो सकी: " + fileKey);
                return res.text();
            })
            .then(html => {
                contentDiv.innerHTML = html;
                loader.style.display = "none";

                // स्क्रिप्ट्स निष्पादित करना
                const scripts = contentDiv.querySelectorAll("script");
                scripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => {
                loader.style.display = "none";
                contentDiv.innerHTML = `<div style="color:red; padding:20px; font-weight:bold;">त्रुटि: ${err.message}</div>`;
            });
        }

        window.onload = function() {
            navigateModule('dashboard', 'Dashboard');
        };
    </script>
</body>
</html>
