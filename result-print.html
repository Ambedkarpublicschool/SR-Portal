<script>
(function() {
    initResultPrintEngine();
})();

function initResultPrintEngine() {
    const listRaw = localStorage.getItem("selectedStudentsList");
    let studentIds = [];
    try {
        studentIds = JSON.parse(listRaw || "[]");
    } catch(e) {
        studentIds = [];
    }

    if (studentIds.length === 0) {
        alert("कोई छात्र चयनित नहीं है!");
        navigateModule('manage-students', 'Manage Students');
        return;
    }

    fetch(`${SCRIPT_URL}?action=getMultipleResultPrintData&studentIds=${encodeURIComponent(JSON.stringify(studentIds))}`)
    .then(r => r.json())
    .then(res => {
        if (res.status !== "SUCCESS" || !res.data || res.data.length === 0) {
            alert("डेटा लोड नहीं हो सका!");
            navigateModule('manage-students', 'Manage Students');
            return;
        }
        renderReportCards(res.data);
    })
    .catch(err => alert("Error: " + err.message));
}

function getRandomScore(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getSubjectGrade(marks) {
    if (marks >= 91) return "A1";
    if (marks >= 81) return "A2";
    if (marks >= 71) return "B1";
    if (marks >= 61) return "B2";
    if (marks >= 51) return "C1";
    if (marks >= 41) return "C2";
    return "D";
}

function convertDateToWords(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('/');
    if (parts.length !== 3) return dateStr;

    const day = parseInt(parts[0], 10);
    const year = parseInt(parts[2], 10);
    const mStr = parts[1];

    const months = { "Jan":"January", "Feb":"February", "Mar":"March", "Apr":"April", "May":"May", "Jun":"June", "Jul":"July", "Aug":"August", "Sep":"September", "Oct":"October", "Nov":"November", "Dec":"December" };
    const totalDays = ["", "First", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh", "Eighth", "Ninth", "Tenth", "Eleventh", "Twelfth", "Thirteenth", "Fourteenth", "Fifteenth", "Sixteenth", "Seventeenth", "Eighteenth", "Nineteenth", "Twentieth", "Twenty-First", "Twenty-Second", "Twenty-Third", "Twenty-Fourth", "Twenty-Fifth", "Twenty-Sixth", "Twenty-Seventh", "Twenty-Eighth", "Twenty-Ninth", "Thirtieth", "Thirty-First"];
    const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
    const teens = ["Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
    const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

    let yearWords = '';
    if (year >= 2000 && year < 2100) {
        let rem = year % 100;
        if (rem === 0) yearWords = "Two Thousand";
        else if (rem < 10) yearWords = "Two Thousand " + ones[rem];
        else if (rem < 20) yearWords = "Two Thousand " + teens[rem - 10];
        else yearWords = "Two Thousand " + tens[Math.floor(rem / 10)] + (rem % 10 !== 0 ? " " + ones[rem % 10] : "");
    }
    return `${totalDays[day] || ''} ${months[mStr] || mStr} ${yearWords}`.trim();
}

function getNextPromotionClass(cls) {
    const list = ["Nursery", "LKG", "UKG", "1", "2", "3", "4", "5", "6", "7", "8"];
    const idx = list.indexOf(cls);
    if (idx !== -1 && idx < list.length - 1) {
        return "Promoted to " + list[idx + 1];
    }
    return "Passed Class 8";
}

function renderReportCards(studentsArray) {
    const container = document.getElementById("resPrintContainer");
    container.innerHTML = "";

    const subjectIcons = {
        "HINDI": "📖",
        "ENGLISH": "📕",
        "MATHEMATICS": "🧮",
        "SCIENCE": "🔬",
        "SOCIAL SCIENCE": "👥",
        "DRAWING": "🎨",
        "GK & MORAL SCIENCE": "💡",
        "COMPUTER": "💻"
    };

    studentsArray.forEach(st => {
        const clsClean = st.currentClass.trim();
        const isPrePrimary = ["Nursery", "LKG", "UKG"].includes(clsClean);

        let subjects = [];
        if (isPrePrimary) {
            subjects = ["HINDI", "ENGLISH", "MATHEMATICS", "DRAWING", "GK & MORAL SCIENCE"];
        } else {
            subjects = ["HINDI", "ENGLISH", "MATHEMATICS", "SCIENCE", "SOCIAL SCIENCE", "DRAWING", "GK & MORAL SCIENCE", "COMPUTER"];
        }

        let annualMarksRows = "";
        let annualObtained = 0;
        const maxMarksPerSub = 100;
        const totalMaxAnnual = subjects.length * maxMarksPerSub;

        subjects.forEach(sub => {
            const marks = getRandomScore(65, 95);
            annualObtained += marks;
            annualMarksRows += `
                <tr>
                    <td class="subNameCell">${subjectIcons[sub] || '📝'} &nbsp;${sub}</td>
                    <td>${maxMarksPerSub}</td>
                    <td style="font-size:12px; font-weight:900; color:#000;">${marks}</td>
                    <td style="font-weight:800;">${getSubjectGrade(marks)}</td>
                </tr>
            `;
        });

        const annualGrade = getSubjectGrade(Math.round(annualObtained / subjects.length));
        
        const qMarks = Math.round(annualObtained * (getRandomScore(92, 98) / 100));
        const hyMarks = Math.round(annualObtained * (getRandomScore(95, 101) / 100));
        const grandTotal = qMarks + hyMarks + annualObtained;
        const grandMax = totalMaxAnnual * 3;
        const grandPercentage = ((grandTotal / grandMax) * 100).toFixed(2);
        const overallGrade = getSubjectGrade(parseFloat(grandPercentage));

        const dobWords = convertDateToWords(st.dob);
        const promoText = getNextPromotionClass(clsClean);
        const photoSrc = st.photo || "https://i.postimg.cc/pLt1F2cD/logo-copy.png";

        const cardHtml = `

                    </div>
                    <div class="resSchoolMeta">
                        <div class="recogNo">Recognition Number: G0P0S35326469</div>
                        <h1 class="schoolMainTitle">AMBEDKAR PUBLIC SCHOOL</h1>
                        <div class="schoolAddress">Madhopur, Campierganj, Gorakhpur (U.P.)</div>
                        <div class="udiseCode">U-DISE Code: 09584109312</div>
                        <div class="resultTitlePill">RESULT OF ANNUAL EXAMINATION (${st.session})</div>
                    </div>
                    <div class="resPhotoBox">
                        <img src="${photoSrc}" alt="Student Photo">
                    </div>
                </div>

                <!-- 🌟 2. STUDENT DETAILS -->
                <div class="resStudentGrid">
                    <div class="stCardLeft">
                        <div class="stInfoRow"><span class="stInfoLbl">Student's Name:</span> <span class="stInfoVal">${st.studentName}</span></div>
                        <div class="stInfoRow"><span class="stInfoLbl">Father's Name:</span> <span class="stInfoVal">${st.fatherName}</span></div>
                        <div class="stInfoRow"><span class="stInfoLbl">Mother's Name:</span> <span class="stInfoVal">${st.motherName}</span></div>
                        <div class="stInfoRow"><span class="stInfoLbl">DOB (In Words):</span> <span class="stInfoVal" style="font-size:10.5px;">${dobWords}</span></div>
                    </div>
                    <div class="stCardRight">
                        <div class="stInfoRow"><span class="stInfoLbl" style="min-width:75px;">Student ID:</span> <span class="stInfoVal">${st.studentId}</span> &nbsp;|&nbsp; <span class="stInfoLbl" style="min-width:55px;">Roll No:</span> <span class="stInfoVal">${st.rollNumber}</span></div>
                        <div class="stInfoRow"><span class="stInfoLbl" style="min-width:75px;">Class & Sec:</span> <span class="stInfoVal">${st.currentClass} - ${st.section}</span></div>
                        <div class="stInfoRow"><span class="stInfoLbl" style="min-width:75px;">Date of Birth:</span> <span class="stInfoVal">${st.dob}</span></div>
                        <div class="stInfoRow" style="height:18px;"></div>
                    </div>
                </div>

                <!-- 🌟 3. MAIN BODY -->
                <div class="resBodyGrid">
                    <!-- SCHOLASTIC -->
                    <div class="resScholasticWrap">
                        <div class="boxHeaderBlue">
                            <span>📚</span> SCHOLASTIC PERFORMANCE (ANNUAL EXAMINATION)
                        </div>
                        <table class="scholasticTable">
                            <thead>
                                <tr>
                                    <th width="48%">Subject</th>
                                    <th width="16%">Max</th>
                                    <th width="18%">Gained</th>
                                    <th width="18%">Grade</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${annualMarksRows}
                                <tr class="totalRow">
                                    <td class="subNameCell" style="font-size:11.5px;">Total (Annual Exam)</td>
                                    <td>${totalMaxAnnual}</td>
                                    <td style="font-size:12.5px; color:#0b3c5d;">${annualObtained}</td>
                                    <td>${annualGrade}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- RIGHT SIDEBAR -->
                    <div class="resRightWrap">
                        <!-- Co-Scholastic -->
                        <div class="sideBox">
                            <div class="boxHeaderGreen"><span>👥</span> CO-SCHOLASTIC AREAS</div>
                            <div class="sideBoxContent">
                                <div class="sideRow"><span>Discipline</span><strong>Well-Behaved</strong></div>
                                <div class="sideRow"><span>Cleanliness</span><strong>Maintained</strong></div>
                                <div class="sideRow"><span>Speaking Skill</span><strong>Articulate</strong></div>
                                <div class="sideRow"><span>Activity Participation</span><strong>Enthusiastic</strong></div>
                                <div class="sideRow"><span>Homework Regularity</span><strong>Consistent</strong></div>
                            </div>
                        </div>

                        <!-- Attendance -->
                        <div class="sideBox">
                            <div class="boxHeaderPink"><span>📅</span> ATTENDANCE RECORD</div>
                            <div class="sideBoxContent">
                                <div class="sideRow"><span>Working Days:</span><strong>210</strong></div>
                                <div class="sideRow"><span>Present Days:</span><strong>188</strong></div>
                                <div class="sideRow"><span>Attendance:</span><strong style="color:#047857;">89.52%</strong></div>
                            </div>
                        </div>

                        <!-- Progress Summary -->
                        <div class="sideBox" style="flex:1; display:flex; flex-direction:column; justify-content:space-between;">
                            <div class="boxHeaderOrange"><span>📈</span> CONSOLIDATED PROGRESS SUMMARY</div>
                            <div class="sideBoxContent" style="flex:1; display:flex; flex-direction:column; justify-content:space-between;">
                                <div class="sideRow"><span>1. Quarterly Exam:</span><strong>${qMarks}/${totalMaxAnnual}</strong></div>
                                <div class="sideRow"><span>2. Half Yearly Exam:</span><strong>${hyMarks}/${totalMaxAnnual}</strong></div>
                                <div class="sideRow"><span>3. Annual Exam:</span><strong>${annualObtained}/${totalMaxAnnual}</strong></div>
                                <div class="sideRow" style="border-top:1.5px solid #0284c7; padding-top:2px;">
                                    <strong>Grand Total:</strong><strong>${grandTotal}/${grandMax}</strong>
                                </div>
                                <div class="sideRow">
                                    <strong>Percentage:</strong><strong style="font-size:12px; color:#0b3c5d;">${grandPercentage}%</strong>
                                </div>
                                <div class="sideRow">
                                    <strong>Overall Grade:</strong><strong style="font-size:12px; color:#0b3c5d;">${overallGrade}</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 🌟 4. TEACHER REMARK -->
                <div class="resRemarkBar">
                    <div><span>🖊️</span> Teacher's Remark: <span style="text-decoration:underline;">Shows consistent progress, good conduct and focus.</span></div>
                    <div>Promotion Status: <span style="text-decoration:underline; color:#0369a1;">${promoText}</span></div>
                </div>

                <!-- 🌟 5. EXACT 40mm SIGNATURE & STAMP SPACE -->
                <div class="resSignBox40mm">
                    <div style="font-size:11.5px; font-weight:800; color:#000;">Date: 05/09/2026</div>
                    <div class="signLineWrap">
                        <div></div>
                        <div class="signSolidLine">Class Teacher</div>
                        <div class="signSolidLine">Principal (with Seal)</div>
                    </div>
                </div>

                <!-- 🌟 6. BOTTOM BANNER -->
                <div class="resBottomDeco">

                    <span>🌿 Bright Minds Brighter Tomorrows 🌿</span>
                    <span>🎓</span>
                </div>
            </div>
        `;
        container.insertAdjacentHTML("beforeend", cardHtml);
    });
}

function executeSafeResultPrint() {
    const printContent = document.getElementById("resPrintContainer").innerHTML;
    
    const oldFrame = document.getElementById("printIframe");
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement("iframe");
    iframe.id = "printIframe";
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "none";
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Annual Examination Report Card</title>
            <style>
                @page {
                    size: A4 portrait;
                    margin: 0;
                }
                * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                html, body {
                    margin: 0;
                    padding: 0;
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    background: #fff;
                    color: #000;
                    width: 210mm;
                    height: 297mm;
                }
                .resSheet {
                    width: 210mm;
                    height: 297mm;
                    max-height: 297mm;
                    box-sizing: border-box;
                    page-break-after: always;
                    break-after: page;
                    margin: 0;
                    padding: 6mm 8mm 4mm 8mm;
                    border: 3px solid #0284c7;
                    display: flex;
                    flex-direction: column;
                    justify-content: space-between;
                    overflow: hidden;
                }
                .resSheet:last-child {
                    page-break-after: avoid;
                    break-after: avoid;
                }
                .resHeaderSection {
                    background: #f0f9ff !important;
                    border: 2px solid #0284c7;
                    border-radius: 12px;
                    padding: 6px 12px 4px 12px;
