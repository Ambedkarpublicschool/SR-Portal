<style>

/* MAIN BODY */
.resMainBody {

.resLeftCol {

    background: #f1f5f9;
    font-size: 10px;

}

    display: flex;

.resDataRow:last-child {
    border-bottom: none;
}

/* FOOTER & DEDICATED SIGNATURE / STAMP AREA */
.resFooter {
    border-top: 1.5px solid #0b3c5d;
    padding-top: 5px;
    flex-shrink: 0;
}
.resRemarksRow {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: bold;
}

/* 🌟 सिग्नेचर और स्टैम्प के लिए 50px की खाली जगह */
.resSigRow {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    margin-top: 50px;
    font-size: 11.5px;
    font-weight: bold;
    text-align: center;
}
.sigLine {
    border-top: 1.5px solid #000;
    padding-top: 3px;
    min-width: 160px;

</style>

<div class="resPrintPage">
    <div class="resPrintActions">
        <button id="printResBtn" onclick="executeSafeResultPrint()">🖨️ Print All Results</button>
        <button id="closeResPrintBtn" onclick="navigateModule('manage-students', 'Manage Students')">Back</button>
    </div>

    <div id="resPrintContainer">
        <div style="text-align:center; padding:50px; font-weight:bold;">Generating Report Cards...</div>
    </div>
</div>

<script>
(function() {
    initResultPrintEngine();
})();

function initResultPrintEngine() {
    const listRaw = localStorage.getItem("selectedStudentsList");
    let studentIds = [];
    try {
        studentIds = JSON.parse(listRaw || "[]");
    } catch(e) {
        studentIds = [];
    }

    if (studentIds.length === 0) {
        alert("कोई छात्र चयनित नहीं है!");
        navigateModule('manage-students', 'Manage Students');
        return;
    }

    fetch(`${SCRIPT_URL}?action=getMultipleResultPrintData&studentIds=${encodeURIComponent(JSON.stringify(studentIds))}`)
    .then(r => r.json())
    .then(res => {
        if (res.status !== "SUCCESS" || !res.data || res.data.length === 0) {
            alert("डेटा लोड नहीं हो सका!");
            navigateModule('manage-students', 'Manage Students');
            return;
        }
        renderReportCards(res.data);
    })
    .catch(err => alert("Error: " + err.message));
}

function getRandomScore(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getSubjectGrade(marks) {
    if (marks >= 91) return "A1";
    if (marks >= 81) return "A2";
    if (marks >= 71) return "B1";
    if (marks >= 61) return "B2";
    if (marks >= 51) return "C1";
    if (marks >= 41) return "C2";
    return "D";
}

function convertDateToWords(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('/');
    if (parts.length !== 3) return dateStr;

    const day = parseInt(parts[0], 10);
    const year = parseInt(parts[2], 10);
    const mStr = parts[1];

    const months = { "Jan":"January", "Feb":"February", "Mar":"March", "Apr":"April", "May":"May", "Jun":"June", "Jul":"July", "Aug":"August", "Sep":"September", "Oct":"October", "Nov":"November", "Dec":"December" };
    const totalDays = ["", "First", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh", "Eighth", "Ninth", "Tenth", "Eleventh", "Twelfth", "Thirteenth", "Fourteenth", "Fifteenth", "Sixteenth", "Seventeenth", "Eighteenth", "Nineteenth", "Twentieth", "Twenty-First", "Twenty-Second", "Twenty-Third", "Twenty-Fourth", "Twenty-Fifth", "Twenty-Sixth", "Twenty-Seventh", "Twenty-Eighth", "Twenty-Ninth", "Thirtieth", "Thirty-First"];
    const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
    const teens = ["Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
    const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

    let yearWords = '';
    if (year >= 2000 && year < 2100) {
        let rem = year % 100;
        if (rem === 0) yearWords = "Two Thousand";
        else if (rem < 10) yearWords = "Two Thousand " + ones[rem];
        else if (rem < 20) yearWords = "Two Thousand " + teens[rem - 10];
        else yearWords = "Two Thousand " + tens[Math.floor(rem / 10)] + (rem % 10 !== 0 ? " " + ones[rem % 10] : "");
    }
    return `${totalDays[day] || ''} ${months[mStr] || mStr} ${yearWords}`.trim();
}

function getNextPromotionClass(cls) {
    const list = ["Nursery", "LKG", "UKG", "1", "2", "3", "4", "5", "6", "7", "8"];
    const idx = list.indexOf(cls);
    if (idx !== -1 && idx < list.length - 1) {
        return "Promoted to " + list[idx + 1];
    }
    return "Passed Class 8";
}

function renderReportCards(studentsArray) {
    const container = document.getElementById("resPrintContainer");
    container.innerHTML = "";

    studentsArray.forEach(st => {
        const clsClean = st.currentClass.trim();
        const isPrePrimary = ["Nursery", "LKG", "UKG"].includes(clsClean);

        let subjects = [];
        if (isPrePrimary) {
            subjects = ["HINDI", "ENGLISH", "MATHEMATICS", "DRAWING", "GK & MORAL SCIENCE"];
        } else {
            subjects = ["HINDI", "ENGLISH", "MATHEMATICS", "SCIENCE", "SOCIAL SCIENCE", "DRAWING", "GK & MORAL SCIENCE", "COMPUTER"];
        }

        let annualMarksRows = "";
        let annualObtained = 0;
        const maxMarksPerSub = 100;
        const totalMaxAnnual = subjects.length * maxMarksPerSub;

        subjects.forEach(sub => {
            const marks = getRandomScore(65, 95);
            annualObtained += marks;
            annualMarksRows += `
                <tr>
                    <td style="text-align:left; font-weight:bold; color:#1e293b;">${sub}</td>
                    <td>${maxMarksPerSub}</td>
                    <td style="font-size:12px; font-weight:800; color:#0b3c5d;">${marks}</td>
                    <td style="font-weight:bold;">${getSubjectGrade(marks)}</td>
                </tr>
            `;
        });

        const annualGrade = getSubjectGrade(Math.round(annualObtained / subjects.length));
        
        const qMarks = Math.round(annualObtained * (getRandomScore(92, 98) / 100));
        const hyMarks = Math.round(annualObtained * (getRandomScore(95, 101) / 100));
        const grandTotal = qMarks + hyMarks + annualObtained;
        const grandMax = totalMaxAnnual * 3;
        const grandPercentage = ((grandTotal / grandMax) * 100).toFixed(2);
        const overallGrade = getSubjectGrade(parseFloat(grandPercentage));

        const dobWords = convertDateToWords(st.dob);
        const promoText = getNextPromotionClass(clsClean);
        const photoSrc = st.photo || "https://via.placeholder.com/80x95";

        const cardHtml = `
            <div class="resSheet">
                <!-- TOP HEADER -->
                <div class="resHeaderWrap">
                    <div class="resTopHeader">
                        <div class="resTopLeft">
                            <img src="https://i.postimg.cc/pLt1F2cD/logo-copy.png" style="width:70px; height:70px; object-fit:contain; display:block;">
                        </div>
                        <div class="resTopCenter">
                            <div style="font-size:9.5px; font-weight:bold; color:#475569;">Recognition Number: GOP0958326469</div>
                            <h1 class="schoolTitle">AMBEDKAR PUBLIC SCHOOL</h1>
                            <div class="schoolSub">Madhopur, Campierganj, Gorakhpur (U.P.)</div>
                            <div style="font-size:10px; font-weight:bold; color:#0b3c5d;">U-DISE Code: 09584109512</div>
                            <div class="resultBanner">RESULT OF ANNUAL EXAMINATION (${st.session})</div>
                        </div>
                        <div class="resTopRight">
                            <img src="${photoSrc}" class="stPhotoBox" alt="Student Photo">
                        </div>
                    </div>
                </div>

                <!-- PROFILE DETAILS -->
                <table class="resProfileTable">
                    <tr>
                        <td width="50%"><strong>Student's Name:</strong> <span style="font-size:12px; font-weight:bold; text-transform:uppercase;">${st.studentName}</span></td>
                        <td width="50%"><strong>Student ID:</strong> <strong>${st.studentId}</strong> &nbsp;&nbsp;|&nbsp;&nbsp; <strong>Roll No:</strong> ${st.rollNumber}</td>
                    </tr>
                    <tr>
                        <td><strong>Father's Name:</strong> ${st.fatherName}</td>
                        <td><strong>Class & Sec:</strong> <strong>${st.currentClass} - ${st.section}</strong></td>
                    </tr>
                    <tr>
                        <td><strong>Mother's Name:</strong> ${st.motherName}</td>
                        <td><strong>Date of Birth:</strong> ${st.dob}</td>
                    </tr>
                    <tr>
                        <td colspan="2"><strong>DOB (In Words):</strong> ${dobWords}</td>
                    </tr>
                </table>

                <!-- MAIN GRADES SECTION -->
                <div class="resMainBody">
                    <!-- LEFT: SCHOLASTIC -->
                    <div class="resLeftCol">
                        <div class="resTableSectionTitle">
                            SCHOLASTIC PERFORMANCE (ANNUAL EXAMINATION)
                        </div>
                        <table class="resTable">
                            <thead>
                                <tr>
                                    <th width="46%" style="text-align:left;">Subject</th>
                                    <th width="18%">Max</th>
                                    <th width="18%">Gained</th>
                                    <th width="18%">Grade</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${annualMarksRows}
                                <tr style="background:#f1f5f9; font-weight:bold; border-top:1.5px solid #0b3c5d;">
                                    <td style="text-align:left; font-weight:900;">Total (Annual Exam)</td>
                                    <td>${totalMaxAnnual}</td>
                                    <td style="font-size:12px; font-weight:900; color:#0b3c5d;">${annualObtained}</td>
                                    <td style="font-weight:900;">${annualGrade}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- RIGHT: CO-SCHOLASTIC, ATTENDANCE & SUMMARY -->
                    <div class="resRightCol">
                        <!-- Co-Scholastic -->
                        <div class="resBox">
                            <div class="resBoxTitle">CO-SCHOLASTIC AREAS</div>
                            <div class="resDataRow"><span>Discipline</span><strong>Well-Behaved</strong></div>
                            <div class="resDataRow"><span>Cleanliness</span><strong>Maintained</strong></div>
                            <div class="resDataRow"><span>Speaking Skill</span><strong>Articulate</strong></div>
                            <div class="resDataRow"><span>Activity Participation</span><strong>Enthusiastic</strong></div>
                            <div class="resDataRow"><span>Homework Regularity</span><strong>Consistent</strong></div>
                        </div>

                        <!-- Attendance -->
                        <div class="resBox">
                            <div class="resBoxTitle">ATTENDANCE RECORD</div>
                            <div class="resDataRow"><span>Working Days:</span><strong>210</strong></div>
                            <div class="resDataRow"><span>Present Days:</span><strong>188</strong></div>
                            <div class="resDataRow"><span>Attendance:</span><strong style="color:#16a34a;">89.52%</strong></div>
                        </div>

                        <!-- Consolidated Progress -->
                        <div class="resBox" style="flex:1; display:flex; flex-direction:column; justify-content:space-between;">
                            <div class="resBoxTitle">CONSOLIDATED PROGRESS SUMMARY</div>
                            <div class="resDataRow"><span>1. Quarterly Exam:</span><strong>${qMarks}/${totalMaxAnnual}</strong></div>
                            <div class="resDataRow"><span>2. Half Yearly Exam:</span><strong>${hyMarks}/${totalMaxAnnual}</strong></div>
                            <div class="resDataRow"><span>3. Annual Exam:</span><strong>${annualObtained}/${totalMaxAnnual}</strong></div>
                            <div class="resDataRow" style="border-top:1.5px solid #0b3c5d; padding-top:2px;">
                                <strong>Grand Total:</strong><strong>${grandTotal}/${grandMax}</strong>
                            </div>
                            <div class="resDataRow">
                                <strong>Percentage:</strong><strong style="font-size:11.5px; color:#0b3c5d;">${grandPercentage}%</strong>
                            </div>
                            <div class="resDataRow">
                                <strong>Overall Grade:</strong><strong style="font-size:11.5px; color:#0b3c5d;">${overallGrade}</strong>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FOOTER -->
                <div class="resFooter">
                    <div class="resRemarksRow">
                        <div>Teacher's Remark: <u>Shows consistent progress, good conduct and focus.</u></div>
                        <div>Promotion Status: <u style="color:#0b3c5d;">${promoText}</u></div>
                    </div>
                    
                    <!-- 50px की खाली जगह के साथ सिग्नेचर रो -->
                    <div class="resSigRow">
                        <div>Date: 05/09/2026</div>
                        <div>
                            <div class="sigLine">Class Teacher</div>
                        </div>
                        <div>
                            <div class="sigLine">Principal (with Seal)</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML("beforeend", cardHtml);
    });
}

function executeSafeResultPrint() {
    const printContent = document.getElementById("resPrintContainer").innerHTML;
    
    const oldFrame = document.getElementById("printIframe");
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement("iframe");
    iframe.id = "printIframe";
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "none";
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Annual Examination Report Card</title>
            <style>
                @page {
                    size: A4 portrait;
                    margin: 0;
                }
                * { box-sizing: border-box; }
                html, body {
                    margin: 0;
                    padding: 0;
                    font-family: Arial, Helvetica, sans-serif;
                    background: #fff;
                    color: #000;
                    width: 210mm;
                    height: 297mm;
                }
                .resSheet {
                    width: 210mm;
                    height: 297mm;
                    max-height: 297mm;
                    box-sizing: border-box;
                    page-break-after: always;
                    break-after: page;
                    margin: 0;
                    padding: 7mm 12mm 8mm 12mm;
                    border: 3px double #0b3c5d;
                    display: flex;
                    flex-direction: column;
                    justify-content: space-between;
                    overflow: hidden;
                }
                .resSheet:last-child {
                    page-break-after: avoid;
                    break-after: avoid;
                }
                .resHeaderWrap { border-bottom: 2px solid #0b3c5d; padding-bottom: 4px; margin-bottom: 5px; flex-shrink: 0; }
                .resTopHeader { display: table; width: 100%; }
                .resTopLeft { display: table-cell; width: 14%; vertical-align: middle; }
                .resTopCenter { display: table-cell; width: 71%; text-align: center; vertical-align: middle; }
                .resTopRight { display: table-cell; width: 15%; text-align: right; vertical-align: middle; }
                .schoolTitle { margin: 0; font-size: 21px; color: #0b3c5d; font-weight: 900; }
                .schoolSub { font-size: 11px; font-weight: bold; color: #333; margin: 1px 0; }
                .resultBanner { background: #0b3c5d !important; color: #fff !important; padding: 3px 10px; font-size: 11px; font-weight: bold; border-radius: 4px; display: inline-block; -webkit-print-color-adjust: exact; }
                .stPhotoBox { width: 76px; height: 88px; border: 2px solid #0b3c5d; object-fit: cover; -webkit-print-color-adjust: exact; }
                .resProfileTable { width: 100%; border-collapse: collapse; margin-bottom: 5px; font-size: 11px; flex-shrink: 0; }
                .resProfileTable td { padding: 3px 6px; border: 1px solid #000; }
                .resMainBody { display: flex; gap: 8px; flex: 1; margin-bottom: 4px; min-height: 0; }
                .resLeftCol { flex: 1.35; display: flex; flex-direction: column; border: 1.5px solid #000; }
                .resTableSectionTitle { font-size: 10.5px; font-weight: 800; background: #0b3c5d !important; color: #fff !important; text-align: center; padding: 3.5px; -webkit-print-color-adjust: exact; }
                .resRightCol { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 5px; }
                .resTable { width: 100%; height: 100%; border-collapse: collapse; }
                .resTable th, .resTable td { border: 1px solid #000; padding: 2.5px 5px; font-size: 10.5px; text-align: center; }
                .resTable th { background: #f1f5f9 !important; font-weight: 800; color: #000; -webkit-print-color-adjust: exact; }
                .resBox { border: 1.5px solid #000; padding: 4px 6px; }
                .resBoxTitle { background: #f1f5f9 !important; font-size: 10px; font-weight: 800; text-align: center; border-bottom: 1.5px solid #000; margin: -4px -6px 3px -6px; padding: 2px 0; -webkit-print-color-adjust: exact; }
                .resDataRow { display: flex; justify-content: space-between; padding: 1.5px 0; font-size: 10.5px; border-bottom: 1px dashed #999; }
                .resDataRow:last-child { border-bottom: none; }
                .resFooter { border-top: 1.5px solid #000; padding-top: 5px; flex-shrink: 0; }
                .resRemarksRow { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: bold; }
                .resSigRow { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; margin-top: 48px; font-size: 11px; font-weight: bold; text-align: center; }
                .sigLine { border-top: 1.5px solid #000; padding-top: 2px; min-width: 150px; }
            </style>
        </head>
        <body>
            ${printContent}
        </body>
        </html>
    `);
    doc.close();

    setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
    }, 450);
}
</script>
