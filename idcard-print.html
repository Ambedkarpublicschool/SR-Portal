<style>
/* ==========================================================================
   1. SCREEN VIEW STYLES
   ========================================================================== */
.idPrintPage {
    background: #cbd5e1;
    padding: 20px 10px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #000;
}

.idPrintActions {
    text-align: center;
    margin-bottom: 20px;
}

.idPrintActions button {
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    margin: 0 6px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

#printIDBtn { background: #16a34a; color: #fff; }
#closeIDPrintBtn { background: #dc2626; color: #fff; }

/* A4 SHEET (210mm x 297mm) - HOLDS 9 ID CARDS (3 x 3 GRID) */
.idA4Sheet {
    width: 210mm;
    height: 297mm;
    max-height: 297mm;
    margin: 0 auto 30px auto;
    background: #ffffff;
    box-sizing: border-box;
    padding: 12mm 15mm;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    display: grid;
    grid-template-columns: repeat(3, 50mm);
    grid-template-rows: repeat(3, 80mm);
    gap: 12mm 15mm;
    justify-content: center;
    align-content: center;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
}

.idA4Sheet:last-child {
    page-break-after: avoid;
    break-after: avoid;
}

/* 🌟 INDIVIDUAL ID CARD (50mm x 80mm) */
.idCardBox {
    width: 50mm;
    height: 80mm;
    box-sizing: border-box;
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    border: 0.5px solid #cbd5e1;
    display: flex;
    flex-direction: column;
}

/* 15mm TOP HEADER */
.idHeaderTop {
    height: 15mm;
    width: 100%;
    box-sizing: border-box;
    padding: 1.5mm 2.5mm 0 2.5mm;
    display: flex;
    align-items: center;
    gap: 2mm;
}

.idLogoImg {
    width: 9.5mm;
    height: 9.5mm;
    object-fit: contain;
    flex-shrink: 0;
}

.idSchoolMeta {
    flex: 1;
    text-align: center;
    line-height: 1.1;
    overflow: hidden;
}

.idSchoolTitle {
    font-size: 5.5pt;
    font-weight: 900;
    color: #0b3c5d;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.idSchoolSub {
    font-size: 3.5pt;
    font-weight: 700;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* 45mm x 60mm INNER CONTENT AREA (2.5mm SIDES MARGIN) */
.idMainContent {
    width: 45mm;
    height: 60mm;
    margin: 0 auto;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* PHOTO & NAME */
.idPhotoFrame {
    width: 17mm;
    height: 21mm;
    border: 1px solid #0284c7;
    border-radius: 3px;
    overflow: hidden;
    background: #f8fafc;
    margin-top: 1mm;
    flex-shrink: 0;
}

.idPhotoFrame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.idStudentName {
    font-size: 6.5pt;
    font-weight: 900;
    color: #991b1b;
    text-transform: uppercase;
    text-align: center;
    margin: 1.5mm 0 1mm 0;
    line-height: 1;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* DETAILS TABLE */
.idDetailsGrid {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.7mm;
    font-size: 4pt;
    line-height: 1.15;
    color: #0f172a;
    font-weight: 700;
}

.idRow {
    display: flex;
    align-items: flex-start;
}

.idLbl {
    width: 15mm;
    flex-shrink: 0;
    color: #000;
}

.idVal {
    flex: 1;
    white-space: normal;
    word-break: break-word;
}

/* QR CODE AREA */
.idQrRow {
    width: 100%;
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    padding-bottom: 0.5mm;
}

.idQrCode {
    width: 9.5mm;
    height: 9.5mm;
    border: 0.5px solid #fff;
    border-radius: 2px;
}

/* 5mm BOTTOM SPACE */
.idBottomSpace {
    height: 5mm;
    width: 100%;
    flex-shrink: 0;
}
</style>

<div class="idPrintPage">
    <div class="idPrintActions">
        <button id="printIDBtn" onclick="executeSafeIDPrint()">🖨️ Print All ID Cards</button>
        <button id="closeIDPrintBtn" onclick="navigateModule('manage-students', 'Manage Students')">Back</button>
    </div>

    <div id="idPrintContainer">
        <div style="text-align:center; padding:50px; font-weight:bold;">Generating ID Cards...</div>
    </div>
</div>

<script>
(function() {
    initIDCardEngine();
})();

function initIDCardEngine() {
    const listRaw = localStorage.getItem("selectedStudentsList");
    let studentIds = [];
    try {
        studentIds = JSON.parse(listRaw || "[]");
    } catch(e) {
        studentIds = [];
    }

    if (studentIds.length === 0) {
        alert("कोई छात्र चयनित नहीं है!");
        navigateModule('manage-students', 'Manage Students');
        return;
    }

    fetch(`${SCRIPT_URL}?action=getMultipleIDCardPrintData&studentIds=${encodeURIComponent(JSON.stringify(studentIds))}`)
    .then(r => r.json())
    .then(res => {
        if (res.status !== "SUCCESS" || !res.data || res.data.length === 0) {
            alert("डेटा लोड नहीं हो सका!");
            navigateModule('manage-students', 'Manage Students');
            return;
        }
        renderIDCardSheets(res.data);
    })
    .catch(err => alert("Error: " + err.message));
}

function renderSingleIDCard(item) {
    const st = item.student;
    const sch = item.school;

    // QR Code डेटा (छात्र का नाम और पिता का नाम)
    const qrText = encodeURIComponent(`Name: ${st.studentName}\nFather: ${st.fatherName}`);
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${qrText}`;

    const photoSrc = st.photo || "https://i.postimg.cc/pLt1F2cD/logo-copy.png";
    const bgImage = sch.bgLink || "https://i.postimg.cc/cJfwsrpq/Chat-GPT-Image-Sep-5-2026-06-04-26-PM.png";
    const logoSrc = sch.logoLink || "https://i.postimg.cc/pLt1F2cD/logo-copy.png";

    return `
        <div class="idCardBox" style="background-image: url('${bgImage}');">
            <!-- 15mm Top Header -->
            <div class="idHeaderTop">
                <img src="${logoSrc}" class="idLogoImg">
                <div class="idSchoolMeta">
                    <div class="idSchoolTitle">${sch.schoolName}</div>
                    <div class="idSchoolSub">${sch.schoolAddress} ${sch.contactNumber}</div>
                </div>
            </div>

            <!-- 45mm x 60mm Inner Content -->
            <div class="idMainContent">
                <div class="idPhotoFrame">
                    <img src="${photoSrc}">
                </div>
                <div class="idStudentName">${st.studentName}</div>

                <div class="idDetailsGrid">
                    <div class="idRow"><span class="idLbl">Father's Name :-</span><span class="idVal">${st.fatherName}</span></div>
                    <div class="idRow"><span class="idLbl">Mother's Name :-</span><span class="idVal">${st.motherName}</span></div>
                    <div class="idRow"><span class="idLbl">Date of Birth :-</span><span class="idVal">${st.dob}</span></div>
                    <div class="idRow"><span class="idLbl">Gender :-</span><span class="idVal">${st.gender}</span></div>
                    <div class="idRow"><span class="idLbl">Aadhaar No :-</span><span class="idVal">${st.aadhaar}</span></div>
                    <div class="idRow"><span class="idLbl">Mobile No :-</span><span class="idVal">${st.mobile}</span></div>
                    <div class="idRow"><span class="idLbl">Address :-</span><span class="idVal">${st.address}</span></div>
                </div>

                <div class="idQrRow">
                    <img src="${qrUrl}" class="idQrCode">
                </div>
            </div>

            <!-- 5mm Bottom Space -->
            <div class="idBottomSpace"></div>
        </div>
    `;
}

function renderIDCardSheets(studentsArray) {
    const container = document.getElementById("idPrintContainer");
    container.innerHTML = "";

    // 1 A4 पेज पर ठीक 9 कार्ड्स
    for (let i = 0; i < studentsArray.length; i += 9) {
        const batch = studentsArray.slice(i, i + 9);
        let cardsHtml = "";
        batch.forEach(item => {
            cardsHtml += renderSingleIDCard(item);
        });

        const sheetHtml = `<div class="idA4Sheet">${cardsHtml}</div>`;
        container.insertAdjacentHTML("beforeend", sheetHtml);
    }
}

function executeSafeIDPrint() {
    const printContent = document.getElementById("idPrintContainer").innerHTML;
    
    const oldFrame = document.getElementById("printIframe");
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement("iframe");
    iframe.id = "printIframe";
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "none";
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Student ID Cards</title>
            <style>
                @page {
                    size: A4 portrait;
                    margin: 0;
                }
                * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                html, body {
                    margin: 0;
                    padding: 0;
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    background: #fff;
                    color: #000;
                    width: 210mm;
                    height: 297mm;
                }
                .idA4Sheet {
                    width: 210mm;
                    height: 297mm;
                    max-height: 297mm;
                    box-sizing: border-box;
                    padding: 12mm 15mm;
                    display: grid;
                    grid-template-columns: repeat(3, 50mm);
                    grid-template-rows: repeat(3, 80mm);
                    gap: 12mm 15mm;
                    justify-content: center;
                    align-content: center;
                    page-break-after: always;
                    break-after: page;
                    overflow: hidden;
                }
                .idA4Sheet:last-child {
                    page-break-after: avoid;
                    break-after: avoid;
                }
                .idCardBox {
                    width: 50mm;
                    height: 80mm;
                    box-sizing: border-box;
                    position: relative;
                    border-radius: 6px;
                    overflow: hidden;
                    background-size: 100% 100%;
                    background-repeat: no-repeat;
                    background-position: center;
                    display: flex;
                    flex-direction: column;
                }
                .idHeaderTop { height: 15mm; width: 100%; box-sizing: border-box; padding: 1.5mm 2.5mm 0 2.5mm; display: flex; align-items: center; gap: 2mm; }
                .idLogoImg { width: 9.5mm; height: 9.5mm; object-fit: contain; flex-shrink: 0; }
                .idSchoolMeta { flex: 1; text-align: center; line-height: 1.1; overflow: hidden; }
                .idSchoolTitle { font-size: 5.5pt; font-weight: 900; color: #0b3c5d; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                .idSchoolSub { font-size: 3.5pt; font-weight: 700; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                .idMainContent { width: 45mm; height: 60mm; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
                .idPhotoFrame { width: 17mm; height: 21mm; border: 1px solid #0284c7; border-radius: 3px; overflow: hidden; background: #f8fafc; margin-top: 1mm; flex-shrink: 0; }
                .idPhotoFrame img { width: 100%; height: 100%; object-fit: cover; }
                .idStudentName { font-size: 6.5pt; font-weight: 900; color: #991b1b; text-transform: uppercase; text-align: center; margin: 1.5mm 0 1mm 0; line-height: 1; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                .idDetailsGrid { width: 100%; display: flex; flex-direction: column; gap: 0.7mm; font-size: 4pt; line-height: 1.15; color: #0f172a; font-weight: 700; }
                .idRow { display: flex; align-items: flex-start; }
                .idLbl { width: 15mm; flex-shrink: 0; color: #000; }
                .idVal { flex: 1; white-space: normal; word-break: break-word; }
                .idQrRow { width: 100%; margin-top: auto; display: flex; align-items: flex-end; padding-bottom: 0.5mm; }
                .idQrCode { width: 9.5mm; height: 9.5mm; }
                .idBottomSpace { height: 5mm; width: 100%; flex-shrink: 0; }
            </style>
        </head>
        <body>
            ${printContent}
        </body>
        </html>
    `);
    doc.close();

    setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
    }, 450);
}
</script>
