<style>
/* ==========================================================================
   1. SCREEN VIEW STYLES
   ========================================================================== */
.idPrintPage {
    background: #cbd5e1;
    padding: 20px 10px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #000;
}

.idPrintActions {
    text-align: center;
    margin-bottom: 20px;
}

.idPrintActions button {
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    margin: 0 6px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

#printIDBtn { background: #16a34a; color: #fff; }
#closeIDPrintBtn { background: #dc2626; color: #fff; }

/* A4 SHEET (210mm x 297mm) - 9 CARDS */
.idA4Sheet {
    width: 210mm;
    height: 297mm;
    max-height: 297mm;
    margin: 0 auto 30px auto;
    background: #ffffff;
    box-sizing: border-box;
    padding: 12mm 15mm;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    display: grid;
    grid-template-columns: repeat(3, 50mm);
    grid-template-rows: repeat(3, 80mm);
    gap: 12mm 15mm;
    justify-content: center;
    align-content: center;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
}

.idA4Sheet:last-child {
    page-break-after: avoid;
    break-after: avoid;
}

/* 🌟 ID CARD (50mm x 80mm) WITH BG LINK */
.idCardBox {
    width: 50mm;
    height: 80mm;
    box-sizing: border-box;
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    border: 0.8px solid #0284c7;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

/* 🌟 TOP 15mm HEADER (BIGGER WHITE TEXT IN 3 LINES) */
.idHeaderTop {
    height: 15.5mm;
    width: 100%;
    box-sizing: border-box;
    padding: 1mm 2mm 0 2mm;
    display: flex;
    align-items: center;
    gap: 1.5mm;
    z-index: 2;
}

.idLogoImg {
    width: 11mm;
    height: 11mm;
    object-fit: contain;
    flex-shrink: 0;
    border-radius: 50%;
    background: #ffffff;
    padding: 0.5px;
    border: 1px solid #ffffff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
}

.idSchoolMeta {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
}

/* Line 1: स्कूल का नाम - बड़ा, बोल्ड, शुद्ध सफेद */
.idSchoolTitle {
    font-size: 6.8pt;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2.5px rgba(0,0,0,0.9);
}

/* Line 2: स्कूल का पता - बड़ा व साफ़ सफेद */
.idSchoolAddress {
    font-size: 4.4pt;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.15;
    margin-top: 0.4mm;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,0.85);
}

/* Line 3: संपर्क सूत्र - साफ़ सफेद */
.idSchoolContact {
    font-size: 4.4pt;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.1;
    margin-top: 0.3mm;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,0.85);
}

/* 🌟 INNER CONTENT AREA */
.idMainContent {
    width: 46mm;
    height: 60mm;
    margin: 0 auto;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 1mm;
    flex: 1;
    position: relative;
    z-index: 2;
}

/* फोटो फ्रेम (हाइट 21mm ताकि नाम कभी न कटे) */
.idPhotoFrame {
    width: 19mm;
    height: 21mm;
    border: 1.5px solid #0284c7;
    border-radius: 4px;
    overflow: hidden;
    background: #ffffff;
    flex-shrink: 0;
    box-shadow: 0 1.5px 4px rgba(0,0,0,0.2);
}

.idPhotoFrame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* 🌟 स्टूडेंट नेम (अब पूरा दिखेगा, कभी नहीं कटेगा) */
.idStudentName {
    font-size: 7.2pt;
    font-weight: 900;
    color: #991b1b;
    text-transform: uppercase;
    text-align: center;
    margin: 1.2mm 0 1.2mm 0;
    line-height: 1.15;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.2px;
}

/* स्टूडेंट विवरण ग्रिड */
.idDetailsGrid {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.75mm;
    font-size: 4.7pt;
    line-height: 1.18;
    color: #000000;
    font-weight: 800;
    padding: 0 0.5mm;
}

.idRow {
    display: flex;
    align-items: flex-start;
}

.idLbl {
    width: 17.5mm;
    flex-shrink: 0;
    color: #000000;
    font-weight: 900;
}

.idVal {
    flex: 1;
    font-weight: 800;
    color: #0f172a;
    white-space: normal;
    word-break: break-word;
}

/* बॉटम QR कोड */
.idQrRow {
    width: 100%;
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    padding-bottom: 0.8mm;
    z-index: 3;
}

.idQrCode {
    width: 10mm;
    height: 10mm;
    border: 0.5px solid #cbd5e1;
    border-radius: 2px;
    background: #ffffff;
    padding: 0.3mm;
}

/* बॉटम स्पेस */
.idBottomSpace {
    height: 4.5mm;
    width: 100%;
    flex-shrink: 0;
}
</style>

<div class="idPrintPage">
    <div class="idPrintActions">
        <button id="printIDBtn" onclick="executeSafeIDPrint()">🖨️ Print All ID Cards</button>
        <button id="closeIDPrintBtn" onclick="navigateModule('manage-students', 'Manage Students')">Back</button>
    </div>

    <div id="idPrintContainer">
        <div style="text-align:center; padding:50px; font-weight:bold;">Generating ID Cards...</div>
    </div>
</div>

<script>
(function() {
    initIDCardEngine();
})();

function initIDCardEngine() {
    const listRaw = localStorage.getItem("selectedStudentsList");
    let studentIds = [];
    try {
        studentIds = JSON.parse(listRaw || "[]");
    } catch(e) {
        studentIds = [];
    }

    if (studentIds.length === 0) {
        alert("कोई छात्र चयनित नहीं है!");
        navigateModule('manage-students', 'Manage Students');
        return;
    }

    fetch(`${SCRIPT_URL}?action=getMultipleIDCardPrintData&studentIds=${encodeURIComponent(JSON.stringify(studentIds))}`)
    .then(r => r.json())
    .then(res => {
        if (res.status !== "SUCCESS" || !res.data || res.data.length === 0) {
            alert("डेटा लोड नहीं हो सका!");
            navigateModule('manage-students', 'Manage Students');
            return;
        }
        renderIDCardSheets(res.data);
    })
    .catch(err => alert("Error: " + err.message));
}

function formatImgUrl(url) {
    if (!url) return '';
    const str = String(url).trim();
    if (str.includes('drive.google.com')) {
        const match = str.match(/[-\w]{25,}/);
        if (match) return 'https://lh3.googleusercontent.com/d/' + match[0];
    }
    return str;
}

function renderSingleIDCard(item) {
    const st = item.student;
    const sch = item.school;

    const PRIMARY_LOGO = "https://i.postimg.cc/pLt1F2cD/logo-copy.png";
    const rawLogo = sch.logoLink ? formatImgUrl(sch.logoLink) : PRIMARY_LOGO;
    const rawPhoto = st.photo ? formatImgUrl(st.photo) : PRIMARY_LOGO;
    const bgImage = sch.bgLink || "https://i.postimg.cc/cJfwsrpq/Chat-GPT-Image-Sep-5-2026-06-04-26-PM.png";

    const qrText = encodeURIComponent(`Name: ${st.studentName}\nFather: ${st.fatherName}`);
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${qrText}`;

    return `
        <div class="idCardBox" style="background-image: url('${bgImage}');">
            <!-- 15.5mm Top Header (Big White Text) -->
            <div class="idHeaderTop">
                <img src="${rawLogo}" class="idLogoImg" onerror="this.onerror=null;this.src='${PRIMARY_LOGO}';">
                <div class="idSchoolMeta">
                    <div class="idSchoolTitle">${sch.schoolName}</div>
                    <div class="idSchoolAddress">${sch.schoolAddress}</div>
                    <div class="idSchoolContact">Mob. No. ${sch.contactNumber}</div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="idMainContent">
                <div class="idPhotoFrame">
                    <img src="${rawPhoto}" onerror="this.onerror=null;this.src='${PRIMARY_LOGO}';">
                </div>
                <div class="idStudentName">${st.studentName}</div>

                <div class="idDetailsGrid">
                    <div class="idRow"><span class="idLbl">Father's Name :-</span><span class="idVal">${st.fatherName}</span></div>
                    <div class="idRow"><span class="idLbl">Mother's Name :-</span><span class="idVal">${st.motherName}</span></div>
                    <div class="idRow"><span class="idLbl">Date of Birth :-</span><span class="idVal">${st.dob}</span></div>
                    <div class="idRow"><span class="idLbl">Gender :-</span><span class="idVal">${st.gender}</span></div>
                    <div class="idRow"><span class="idLbl">Aadhaar No :-</span><span class="idVal">${st.aadhaar}</span></div>
                    <div class="idRow"><span class="idLbl">Mobile No :-</span><span class="idVal">${st.mobile}</span></div>
                    <div class="idRow"><span class="idLbl">Address :-</span><span class="idVal">${st.address}</span></div>
                </div>

                <div class="idQrRow">
                    <img src="${qrUrl}" class="idQrCode" loading="lazy">
                </div>
            </div>

            <!-- Bottom Margin -->
            <div class="idBottomSpace"></div>
        </div>
    `;
}

function renderIDCardSheets(studentsArray) {
    const container = document.getElementById("idPrintContainer");
    container.innerHTML = "";

    for (let i = 0; i < studentsArray.length; i += 9) {
        const batch = studentsArray.slice(i, i + 9);
        let cardsHtml = "";
        batch.forEach(item => {
            cardsHtml += renderSingleIDCard(item);
        });

        const sheetHtml = `<div class="idA4Sheet">${cardsHtml}</div>`;
        container.insertAdjacentHTML("beforeend", sheetHtml);
    }
}

function executeSafeIDPrint() {
    const printContent = document.getElementById("idPrintContainer").innerHTML;
    
    const oldFrame = document.getElementById("printIframe");
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement("iframe");
    iframe.id = "printIframe";
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "none";
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Student ID Cards</title>
            <style>
                @page {
                    size: A4 portrait;
                    margin: 0;
                }
                * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                html, body {
                    margin: 0;
                    padding: 0;
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    background: #fff;
                    color: #000;
                    width: 210mm;
                    height: 297mm;
                }
                .idA4Sheet {
                    width: 210mm;
                    height: 297mm;

                    box-sizing: border-box;
                    padding: 12mm 15mm;

                    grid-template-columns: repeat(3, 50mm);
                    grid-template-rows: repeat(3, 80mm);
                    gap: 12mm 15mm;
                    justify-content: center;
                    align-content: center;
                    page-break-after: always;
                    break-after: page;
                    overflow: hidden;
                }
                .idA4Sheet:last-child {
                    page-break-after: avoid;
                    break-after: avoid;
                }
                .idCardBox {
                    width: 50mm;
                    height: 80mm;
                    box-sizing: border-box;
                    position: relative;
                    border-radius: 8px;
                    overflow: hidden;
                    background-size: 100% 100%;
                    background-repeat: no-repeat;
                    background-position: center;
                    display: flex;
                    flex-direction: column;
                }
                .idHeaderTop {
                    height: 15.5mm;
                    width: 100%;
                    box-sizing: border-box;
                    padding: 1mm 2mm 0 2mm;
                    display: flex;
                    align-items: center;
                    gap: 1.5mm;
                    z-index: 2;
                }
                .idLogoImg {
                    width: 11mm;
                    height: 11mm;
                    object-fit: contain;
                    flex-shrink: 0;
                    border-radius: 50%;
                    background: #ffffff;
                    padding: 0.5px;
                    border: 1px solid #ffffff;
                }
                .idSchoolMeta {
                    flex: 1;
                    text-align: center;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    overflow: hidden;
                }
                .idSchoolTitle {
                    font-size: 6.8pt;
                    font-weight: 900;
                    color: #ffffff !important;
                    text-transform: uppercase;
                    line-height: 1.1;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    text-shadow: 0 1px 2px #000;
                }
                .idSchoolAddress {
                    font-size: 4.4pt;
                    font-weight: 800;
                    color: #ffffff !important;
                    line-height: 1.15;
                    margin-top: 0.4mm;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    text-shadow: 0 1px 2px #000;
                }
                .idSchoolContact {
                    font-size: 4.4pt;
                    font-weight: 800;
                    color: #ffffff !important;
                    line-height: 1.1;
                    margin-top: 0.3mm;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    text-shadow: 0 1px 2px #000;
                }
                .idMainContent {
                    width: 46mm;
                    height: 60mm;
                    margin: 0 auto;
                    box-sizing: border-box;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    padding-top: 1mm;
                    flex: 1;
                    position: relative;
                    z-index: 2;
                }
                .idPhotoFrame {
                    width: 19mm;
                    height: 21mm;
                    border: 1.5px solid #0284c7;
                    border-radius: 4px;
                    overflow: hidden;
                    background: #ffffff;
                    flex-shrink: 0;
                }
                .idPhotoFrame img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    display: block;
                }
                .idStudentName {
                    font-size: 7.2pt;
                    font-weight: 900;
                    color: #991b1b !important;
                    text-transform: uppercase;
                    text-align: center;
                    margin: 1.2mm 0 1.2mm 0;
                    line-height: 1.15;
                    width: 100%;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }
                .idDetailsGrid {
                    width: 100%;
                    display: flex;
                    flex-direction: column;
                    gap: 0.75mm;
                    font-size: 4.7pt;
                    line-height: 1.18;
                    color: #000000;
                    font-weight: 800;
                    padding: 0 0.5mm;
                }
                .idRow { display: flex; align-items: flex-start; }
                .idLbl { width: 17.5mm; flex-shrink: 0; color: #000; font-weight: 900; }
                .idVal { flex: 1; font-weight: 800; color: #0f172a; white-space: normal; word-break: break-word; }
                .idQrRow {
                    width: 100%;
                    margin-top: auto;
                    display: flex;
                    align-items: flex-end;
                    padding-bottom: 0.8mm;
                }
                .idQrCode {
                    width: 10mm;
                    height: 10mm;
                    border: 0.5px solid #cbd5e1;
                    border-radius: 2px;
                    background: #fff;
                    padding: 0.3mm;
                }
                .idBottomSpace {
                    height: 4.5mm;
                    width: 100%;
                    flex-shrink: 0;
                }
            </style>
        </head>
        <body>
            ${printContent}
        </body>
        </html>
    `);
    doc.close();

    setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
    }, 450);
}
</script>
