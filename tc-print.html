<style>
/* ==========================================================================
   1. SCREEN VIEW STYLES
   ========================================================================== */
.tcPrintPage {
    background: #f4f6f9;
    padding: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #000;
}

.tcPrintActions {
    text-align: center;
    margin-bottom: 20px;
}

.tcPrintActions button {
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    margin: 0 6px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

#printTCBtn { background: #16a34a; color: #fff; }
#closeTCPrintBtn { background: #dc2626; color: #fff; }

/* A4 SHEET WRAPPER (SCREEN) */
.tcLegalSheet {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 30px auto;
    background: #ffffff;
    padding: 12mm 15mm;
    box-sizing: border-box;
    border: 1px solid #d1d5db;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    position: relative;
}

/* HEADER SECTION */
.tcHeader {
    display: table;
    width: 100%;
    border-bottom: 2px solid #000;
    padding-bottom: 8px;
    margin-bottom: 12px;
}

.tcLogoArea {
    display: table-cell;
    vertical-align: middle;
    width: 15%;
}

.tcLogoArea img {
    width: 75px;
    height: 75px;
    object-fit: contain;
}

.tcSchoolArea {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    width: 85%;
}

.tcSchoolArea h1 {
    margin: 0 0 4px 0;
    font-size: 24px;
    color: #0b3c5d;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.tcSchoolArea div {
    font-size: 12.5px;
    color: #333;
}

.tcTitleArea {
    text-align: center;
    margin: 12px 0 16px;
}

.tcTitleArea h2 {
    display: inline-block;
    margin: 0;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    border-bottom: 1px solid #000;
    padding-bottom: 2px;
}

/* TABLES STYLES */
.tcMetaTable, .tcInfoTable, .tcAcademicTable, .tcLeavingTable {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 10px;
    background: #fff;
}

.tcMetaTable td, .tcInfoTable td, .tcAcademicTable td, .tcAcademicTable th, .tcLeavingTable td {
    border: 1px solid #444;
    padding: 5px 8px;
    font-size: 12px;
    color: #000;
    vertical-align: middle;
}

.tcMetaTable td { width: 50%; }
.lbl { font-weight: bold; background: #fafafa; }

.tcInfoTable td.lbl { width: 22%; }
.tcInfoTable td:not(.lbl) { width: 28%; }
.tcInfoTable td[colspan="3"] { width: 78%; }

.tcSectionHeading {
    margin: 12px 0 6px;
    font-size: 13px;
    text-align: center;
    color: #0b3c5d;
    font-weight: bold;
    text-transform: uppercase;
}

.tcAcademicTable th {
    background: #f1f5f9;
    text-align: center;
    font-weight: bold;
    font-size: 11px;
}

.tcAcademicTable td {
    text-align: center;
    height: 22px;
    font-size: 11.5px;
}

.tcLeavingTable td.lbl { width: 35%; }

.tcCertificateText {
    border: 1px solid #555;
    padding: 8px 12px;
    margin: 12px 0 20px;
    line-height: 1.4;
    text-align: justify;
    font-size: 11px;
}

/* SIGNATURE AREA */
.tcSignatureArea {
    display: table;
    width: 100%;
    margin-top: 30px;
}

.tcSignatureArea .sigBox {
    display: table-cell;
    width: 35%;
    text-align: center;
    vertical-align: bottom;
}

.tcSignatureArea .dateBox {
    display: table-cell;
    width: 30%;
    text-align: center;
    vertical-align: bottom;
    font-size: 12px;
    font-weight: bold;
}

.tcSignatureArea .sigBox .line {
    margin-bottom: 5px;
    font-weight: bold;
}

.tcSignatureArea .sigBox .txt {
    font-size: 12px;
    font-weight: bold;
}

/* ==========================================================================
   2. PRINT MEDIA RULES (PORTAL NAVBAR/HEADER HIDING FIX)
   ========================================================================== */
@page {
    size: A4 portrait;
    margin: 8mm;
}

@media print {
    /* पोर्टल का टॉप बार, साइडबार व पूरा पेरेंट स्ट्रक्चर छिपाएं */
    body * {
        visibility: hidden !important;
    }

    header, nav, .sidebar, .top-nav, .topBar, .navBar, .tcPrintActions {
        display: none !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* केवल TC कंटेनर और उसके अंदर की शीट दृश्यमान होगी */
    #tcPrintContainer, #tcPrintContainer * {
        visibility: visible !important;
    }

    #tcPrintContainer {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .tcLegalSheet {
        width: 100% !important;
        min-height: auto !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        page-break-after: always !important;
        break-after: page !important;
    }

    .tcLegalSheet:last-child {
        page-break-after: avoid !important;
        break-after: avoid !important;
    }

    /* टेबल बॉर्डर प्रिंट में गहरे दिखें */
    .tcMetaTable td, .tcInfoTable td, .tcAcademicTable td, .tcAcademicTable th, .tcLeavingTable td, .tcCertificateText {
        border-color: #000 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
}
</style>

<div class="tcPrintPage">
    <div class="tcPrintActions">
        <button id="printTCBtn" onclick="window.print()">🖨️ Print All TC</button>
        <button id="closeTCPrintBtn" onclick="navigateModule('manage-students', 'Manage Students')">Back</button>
    </div>

    <div id="tcPrintContainer">
        <div style="text-align:center; padding:50px; font-weight:bold;">Loading TC Data...</div>
    </div>
</div>

<script>
(function() {
    initTCPrintEngine();
})();

function initTCPrintEngine() {
    const listRaw = localStorage.getItem("selectedStudentsList");
    let studentIds = [];
    try {
        studentIds = JSON.parse(listRaw || "[]");
    } catch(e) {
        studentIds = [];
    }

    if (studentIds.length === 0) {
        alert("कोई छात्र चयनित नहीं है!");
        navigateModule('manage-students', 'Manage Students');
        return;
    }

    fetch(`${SCRIPT_URL}?action=getMultipleTCPrintData&studentIds=${encodeURIComponent(JSON.stringify(studentIds))}`)
    .then(r => r.json())
    .then(res => {
        if (res.status !== "SUCCESS" || !res.data || res.data.length === 0) {
            alert("टीसी डेटा लोड नहीं हो सका!");
            navigateModule('manage-students', 'Manage Students');
            return;
        }
        renderTCSheets(res.data);
    })
    .catch(err => alert("Error loading TC: " + err.message));
}

/**
 * 1 अप्रैल (रविवार होने पर 2 अप्रैल) निकालने का फ़ंक्शन
 */
function getSmartAdmissionDate(year) {
    const d = new Date(year, 3, 1); // 1st April
    if (d.getDay() === 0) { // Sunday
        return `02-04-${year}`;
    }
    return `01-04-${year}`;
}

/**
 * पिछली कक्षाओं के लिए 31 मार्च (रविवार होने पर 30 मार्च) निकालने का फ़ंक्शन
 */
function getSmartLeavingDate(year) {
    const d = new Date(year, 2, 31); // 31st March
    if (d.getDay() === 0) { // Sunday
        return `30-03-${year}`;
    }
    return `31-03-${year}`;
}

function convertDateToWords(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr; 

    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10);
    const year = parseInt(parts[2], 10);

    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const totalDays = ["", "First", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh", "Eighth", "Ninth", "Tenth", "Eleventh", "Twelfth", "Thirteenth", "Fourteenth", "Fifteenth", "Sixteenth", "Seventeenth", "Eighteenth", "Nineteenth", "Twentieth", "Twenty-First", "Twenty-Second", "Twenty-Third", "Twenty-Fourth", "Twenty-Fifth", "Twenty-Sixth", "Twenty-Seventh", "Twenty-Eighth", "Twenty-Ninth", "Thirtieth", "Thirty-First"];
    const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
    const teens = ["Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
    const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

    let yearWords = '';
    if (year >= 2000 && year < 2100) {
        let rem = year % 100;
        if (rem === 0) yearWords = "Two Thousand";
        else if (rem < 10) yearWords = "Two Thousand " + ones[rem];
        else if (rem < 20) yearWords = "Two Thousand " + teens[rem - 10];
        else yearWords = "Two Thousand " + tens[Math.floor(rem / 10)] + (rem % 10 !== 0 ? " " + ones[rem % 10] : "");
    } else {
        yearWords = year.toString(); 
    }
    return `${totalDays[day] || ''} ${months[month - 1] || ''} ${yearWords}`.trim();
}

function renderTCSheets(studentsArray) {
    const container = document.getElementById("tcPrintContainer");
    container.innerHTML = "";

    const schoolClasses = ["Nursery", "LKG", "UKG", "1", "2", "3", "4", "5", "6", "7", "8"];

    studentsArray.forEach(data => {
        const dobWords = convertDateToWords(data.student.dob);

        // 1. Initial Class (TC_History) और Last Class (Student_Master)
        const initCls = String(data.initialClass || "Nursery").trim();
        const lastCls = String(data.student.currentClass || data.tc.lastClass).trim();
        const lastSes = String(data.tc.lastSession || "2026-2027").trim();

        let startIdx = schoolClasses.indexOf(initCls);
        let endIdx = schoolClasses.indexOf(lastCls);

        if (startIdx === -1) startIdx = 0;
        if (endIdx === -1) endIdx = schoolClasses.length - 1;
        if (startIdx > endIdx) startIdx = endIdx;

        let baseYear = parseInt(lastSes.split("-")[0], 10) || 2026;
        const finalLeavingDate = data.tc.leavingDate || `31-03-${baseYear + 1}`;

        // 2. Result का नियम (अंतिम कक्षा): क्या 31 मार्च से पहले छोड़ रहा है?
        let isLeavingMidSession = false;
        if (data.tc.leavingDate) {
            const parts = data.tc.leavingDate.split("-");
            if (parts.length === 3) {
                const lDay = parseInt(parts[0], 10);
                const lMonth = parseInt(parts[1], 10);
                const lYear = parseInt(parts[2], 10);

                if (lYear === baseYear) {
                    isLeavingMidSession = true;
                } else if (lYear === (baseYear + 1)) {
                    if (lMonth < 3 || (lMonth === 3 && lDay < 31)) {
                        isLeavingMidSession = true;
                    }
                }
            }
        }

        // 3. Academic History Table का निर्माण
        let tableRowsHtml = "";

        schoolClasses.forEach((clsName, idx) => {
            if (idx >= startIdx && idx <= endIdx) {
                const diff = endIdx - idx;
                const clsStartYear = baseYear - diff;
                const clsEndYear = clsStartYear + 1;
                const calculatedSession = `${clsStartYear}-${clsEndYear}`;
                
                const admDate = getSmartAdmissionDate(clsStartYear);

                if (idx === endIdx) {
                    // अंतिम कक्षा
                    const finalResult = isLeavingMidSession ? "Studying" : "Pass";

                    tableRowsHtml += `
                        <tr style="font-weight:bold;">
                            <td>${clsName}</td>
                            <td>${calculatedSession}</td>
                            <td>${admDate}</td>
                            <td>${finalLeavingDate}</td>
                            <td>${finalResult}</td>
                            <td>${data.tc.remarks || 'Good'}</td>
                        </tr>
                    `;
                } else {
                    // पिछली कक्षाएं
                    const leavDate = getSmartLeavingDate(clsEndYear);

                    tableRowsHtml += `
                        <tr>
                            <td>${clsName}</td>
                            <td>${calculatedSession}</td>
                            <td>${admDate}</td>
                            <td>${leavDate}</td>
                            <td>Pass</td>
                            <td>Good</td>
                        </tr>
                    `;
                }
            } else {
                // Initial Class से पहले की कक्षाओं में केवल डैश (-)
                tableRowsHtml += `
                    <tr style="color:#888;">
                        <td>${clsName}</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    </tr>
                `;
            }
        });

        const sheetHtml = `
            <div class="tcLegalSheet">
                <div class="tcHeader">
                    <div class="tcLogoArea">
                        <img src="${data.school.logo}" alt="Logo">
                    </div>
                    <div class="tcSchoolArea">
                        <h1>${data.school.schoolName}</h1>
                        <div>${data.school.address}</div>
                        <div style="font-weight:bold; margin-top:3px;">
                            UDISE: ${data.school.udise} | Recognition: Nursery to 8th
                        </div>
                    </div>
                </div>

                <div class="tcTitleArea">
                    <h2>TRANSFER CERTIFICATE</h2>
                </div>

                <table class="tcMetaTable">
                    <tr>
                        <td><span class="lbl">TC Number:</span> <strong>${data.tc.tcNumber || 'TC01'}</strong></td>
                        <td><span class="lbl">SR Number:</span> <strong>${data.tc.srNumber || '-'}</strong></td>
                    </tr>
                </table>

                <table class="tcInfoTable">
                    <tr>
                        <td class="lbl">Student Name</td>
                        <td><strong>${data.student.studentName}</strong></td>
                        <td class="lbl">Father Name</td>
                        <td>${data.student.fatherName}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Mother Name</td>
                        <td>${data.student.motherName}</td>
                        <td class="lbl">Father Occupation</td>
                        <td>${data.student.fatherOccupation || '-'}</td>
                    </tr>
                    <tr>
                        <td class="lbl">PEN Number</td>
                        <td>${data.student.penNumber || '-'}</td>
                        <td class="lbl">Student ID</td>
                        <td>${data.student.studentId}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Class Last Studied</td>
                        <td><strong>Class ${lastCls}</strong></td>
                        <td class="lbl">Blood Group</td>
                        <td>${data.student.bloodGroup || '-'}</td>
                    </tr>
                    <tr>
                        <td class="lbl">DOB (In Figure)</td>
                        <td>${data.student.dob}</td>
                        <td class="lbl">DOB (In Words)</td>
                        <td style="font-size:11px;">${dobWords}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Religion</td>
                        <td>${data.student.religion || '-'}</td>
                        <td class="lbl">Category / Caste</td>
                        <td>${data.student.category || '-'} (${data.student.caste || '-'})</td>
                    </tr>
                    <tr>
                        <td class="lbl">School Last Attended</td>
                        <td colspan="3">${data.student.previousSchool}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Permanent Address</td>
                        <td colspan="3">${data.student.address}</td>
                    </tr>
                </table>

                <div class="tcSectionHeading">Academic History</div>
                <table class="tcAcademicTable">
                    <thead>
                        <tr>
                            <th width="12%">Class</th>
                            <th width="18%">Session</th>
                            <th width="20%">Date of Admission</th>
                            <th width="20%">Date of Leaving</th>
                            <th width="15%">Result</th>
                            <th width="15%">Remarks</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRowsHtml}
                    </tbody>
                </table>

                <table class="tcLeavingTable">
                    <tr>
                        <td class="lbl">Date of Leaving School</td>
                        <td>${data.tc.leavingDate || '-'}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Reason for Leaving School</td>
                        <td>${data.tc.leavingReason || '-'}</td>
                    </tr>
                </table>

                <div class="tcCertificateText">
                    Certified that the above information is in accordance with the school register. No change in any entry is to be made except by the authority issuing the certificate.
                </div>

                <div class="tcSignatureArea">
                    <div class="dateBox">
                        Date: <span>${data.tc.issueDate}</span>
                    </div>
                    <div class="sigBox">
                        <div class="line">_______________________</div>
                        <div class="txt">Prepared by</div>
                    </div>
                    <div class="sigBox">
                        <div class="line">_______________________</div>
                        <div class="txt">Principal (with Seal)</div>
                    </div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML("beforeend", sheetHtml);
    });
}
</script>
