<style>
/* ==========================================================================
   1. SCREEN VIEW STYLES
   ========================================================================== */
.tcPrintPage {
    background: #cbd5e1;
    padding: 20px 10px;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
}

.tcPrintActions {
    text-align: center;
    margin-bottom: 20px;
}

.tcPrintActions button {
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    margin: 0 6px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

#printTCBtn { background: #16a34a; color: #fff; }
#closeTCPrintBtn { background: #dc2626; color: #fff; }

/* SCREEN A4 SHEET (LOCKED TO 297mm WITH DYNAMIC FLEX DISTRIBUTION) */
.tcLegalSheet {
    width: 210mm;
    height: 297mm;
    max-height: 297mm;
    margin: 0 auto 30px auto;
    background: #ffffff;
    padding: 12mm 15mm 12mm 15mm;
    box-sizing: border-box;
    border: 1px solid #94a3b8;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
}

/* HEADER */
.tcHeader {
    display: table;
    width: 100%;
    border-bottom: 2.5px solid #000;
    padding-bottom: 8px;
    margin-bottom: 8px;
    flex-shrink: 0;
}

.tcLogoArea {
    display: table-cell;
    vertical-align: middle;
    width: 14%;
}

.tcLogoArea img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}

.tcSchoolArea {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    width: 86%;
}

.tcSchoolArea h1 {
    margin: 0 0 4px 0;
    font-size: 26px;
    color: #0b3c5d;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
}

.tcSchoolArea div {
    font-size: 13px;
    color: #333;
}

.tcTitleArea {
    text-align: center;
    margin: 6px 0 10px;
    flex-shrink: 0;
}

.tcTitleArea h2 {
    display: inline-block;
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 1.2px;
    border-bottom: 2px solid #000;
    padding-bottom: 2px;
}

/* TABLES */
.tcMetaTable, .tcInfoTable, .tcLeavingTable {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 8px;
    background: #fff;
    flex-shrink: 0;
}

.tcMetaTable td, .tcInfoTable td, .tcLeavingTable td {
    border: 1.2px solid #222;
    padding: 6px 8px;
    font-size: 12.5px;
    color: #000;
    vertical-align: middle;
}

.tcMetaTable td { width: 50%; font-size: 13.5px; font-weight: bold; }
.lbl { font-weight: bold; background: #fafafa; }

.tcInfoTable td.lbl { width: 22%; }
.tcInfoTable td:not(.lbl) { width: 28%; }
.tcInfoTable td[colspan="3"] { width: 78%; }
.tcLeavingTable td.lbl { width: 35%; }

.tcSectionHeading {
    margin: 8px 0 4px;
    font-size: 14px;
    text-align: center;
    color: #0b3c5d;
    font-weight: bold;
    text-transform: uppercase;
    flex-shrink: 0;
}

/* DYNAMIC ACADEMIC HISTORY CONTAINER */
.tcAcademicWrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 8px;
    min-height: 0;
}

.tcAcademicTable {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    background: #fff;
}

.tcAcademicTable th, .tcAcademicTable td {
    border: 1.2px solid #222;
    text-align: center;
    vertical-align: middle;
}

.tcAcademicTable th {
    background: #f1f5f9;
    font-weight: bold;
    font-size: 12px;
    padding: 6px 4px;
    height: 28px;
}

.tcAcademicTable td {
    font-size: 12.5px;
    padding: 4px 6px;
}

.tcCertificateText {
    border: 1.2px solid #333;
    padding: 8px 12px;
    margin: 6px 0 12px;
    line-height: 1.4;
    text-align: justify;
    font-size: 11.5px;
    flex-shrink: 0;
}

/* SIGNATURES */
.tcSignatureArea {
    display: table;
    width: 100%;
    margin-top: 10px;
    padding-bottom: 4px;
    flex-shrink: 0;
}

.tcSignatureArea .sigBox {
    display: table-cell;
    width: 35%;
    text-align: center;
    vertical-align: bottom;
}

.tcSignatureArea .dateBox {
    display: table-cell;
    width: 30%;
    text-align: center;
    vertical-align: bottom;
    font-size: 13px;
    font-weight: bold;
}

.tcSignatureArea .sigBox .line {
    margin-bottom: 5px;
    font-weight: bold;
}

.tcSignatureArea .sigBox .txt {
    font-size: 12.5px;
    font-weight: bold;
}
</style>

<div class="tcPrintPage">
    <div class="tcPrintActions">
        <button id="printTCBtn" onclick="executeSafePrint()">🖨️ Print All TC</button>
        <button id="closeTCPrintBtn" onclick="navigateModule('manage-students', 'Manage Students')">Back</button>
    </div>

    <div id="tcPrintContainer">
        <div style="text-align:center; padding:50px; font-weight:bold;">Loading TC Data...</div>
    </div>
</div>

<script>
(function() {
    initTCPrintEngine();
})();

function initTCPrintEngine() {
    const listRaw = localStorage.getItem("selectedStudentsList");
    let studentIds = [];
    try {
        studentIds = JSON.parse(listRaw || "[]");
    } catch(e) {
        studentIds = [];
    }

    if (studentIds.length === 0) {
        alert("कोई छात्र चयनित नहीं है!");
        navigateModule('manage-students', 'Manage Students');
        return;
    }

    fetch(`${SCRIPT_URL}?action=getMultipleTCPrintData&studentIds=${encodeURIComponent(JSON.stringify(studentIds))}`)
    .then(r => r.json())
    .then(res => {
        if (res.status !== "SUCCESS" || !res.data || res.data.length === 0) {
            alert("टीसी डेटा लोड नहीं हो सका!");
            navigateModule('manage-students', 'Manage Students');
            return;
        }
        renderTCSheets(res.data);
    })
    .catch(err => alert("Error loading TC: " + err.message));
}

function getSmartAdmissionDate(year) {
    const d = new Date(year, 3, 1);
    if (d.getDay() === 0) return `02-04-${year}`;
    return `01-04-${year}`;
}

function getSmartLeavingDate(year) {
    const d = new Date(year, 2, 31);
    if (d.getDay() === 0) return `30-03-${year}`;
    return `31-03-${year}`;
}

function convertDateToWords(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr; 

    const day = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10);
    const year = parseInt(parts[2], 10);

    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const totalDays = ["", "First", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh", "Eighth", "Ninth", "Tenth", "Eleventh", "Twelfth", "Thirteenth", "Fourteenth", "Fifteenth", "Sixteenth", "Seventeenth", "Eighteenth", "Nineteenth", "Twentieth", "Twenty-First", "Twenty-Second", "Twenty-Third", "Twenty-Fourth", "Twenty-Fifth", "Twenty-Sixth", "Twenty-Seventh", "Twenty-Eighth", "Twenty-Ninth", "Thirtieth", "Thirty-First"];
    const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
    const teens = ["Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
    const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

    let yearWords = '';
    if (year >= 2000 && year < 2100) {
        let rem = year % 100;
        if (rem === 0) yearWords = "Two Thousand";
        else if (rem < 10) yearWords = "Two Thousand " + ones[rem];
        else if (rem < 20) yearWords = "Two Thousand " + teens[rem - 10];
        else yearWords = "Two Thousand " + tens[Math.floor(rem / 10)] + (rem % 10 !== 0 ? " " + ones[rem % 10] : "");
    } else if (year >= 1900 && year < 2000) {
        let secondPart = year % 100; 
        let secondPartWords = "";
        if (secondPart < 10 && secondPart > 0) secondPartWords = "Zero " + ones[secondPart];
        else if (secondPart >= 10 && secondPart < 20) secondPartWords = teens[secondPart - 10];
        else if (secondPart >= 20) secondPartWords = tens[Math.floor(secondPart / 10)] + (secondPart % 10 !== 0 ? " " + ones[secondPart % 10] : "");
        yearWords = "Nineteen " + secondPartWords;
    } else {
        yearWords = year.toString(); 
    }
    return `${totalDays[day] || ''} ${months[month - 1] || ''} ${yearWords}`.trim();
}

function renderTCSheets(studentsArray) {
    const container = document.getElementById("tcPrintContainer");
    container.innerHTML = "";

    const schoolClasses = ["Nursery", "LKG", "UKG", "1", "2", "3", "4", "5", "6", "7", "8"];

    studentsArray.forEach(data => {
        const dobWords = convertDateToWords(data.student.dob);

        const initCls = String(data.initialClass || "Nursery").trim();
        const lastCls = String(data.student.currentClass || data.tc.lastClass).trim();
        const lastSes = String(data.tc.lastSession || "2026-2027").trim();

        let startIdx = schoolClasses.indexOf(initCls);
        let endIdx = schoolClasses.indexOf(lastCls);

        if (startIdx === -1) startIdx = 0;
        if (endIdx === -1) endIdx = schoolClasses.length - 1;
        if (startIdx > endIdx) startIdx = endIdx;

        let baseYear = parseInt(lastSes.split("-")[0], 10) || 2026;
        const finalLeavingDate = data.tc.leavingDate || `31-03-${baseYear + 1}`;
        const finalResult = data.tc.finalResult || "Studying";

        let tableRowsHtml = "";

        schoolClasses.forEach((clsName, idx) => {
            if (idx >= startIdx && idx <= endIdx) {
                const diff = endIdx - idx;
                const clsStartYear = baseYear - diff;
                const clsEndYear = clsStartYear + 1;
                const calculatedSession = `${clsStartYear}-${clsEndYear}`;
                
                const admDate = getSmartAdmissionDate(clsStartYear);

                if (idx === endIdx) {
                    tableRowsHtml += `
                        <tr style="font-weight:bold;">
                            <td>${clsName}</td>
                            <td>${calculatedSession}</td>
                            <td>${admDate}</td>
                            <td>${finalLeavingDate}</td>
                            <td>${finalResult}</td>
                            <td>${data.tc.remarks || 'Good'}</td>
                        </tr>
                    `;
                } else {
                    const leavDate = getSmartLeavingDate(clsEndYear);

                    tableRowsHtml += `
                        <tr>
                            <td>${clsName}</td>
                            <td>${calculatedSession}</td>
                            <td>${admDate}</td>
                            <td>${leavDate}</td>
                            <td>Pass</td>
                            <td>Good</td>
                        </tr>
                    `;
                }
            } else {
                tableRowsHtml += `
                    <tr style="color:#777;">
                        <td>${clsName}</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    </tr>
                `;
            }
        });

        const sheetHtml = `
            <div class="tcLegalSheet">
                <div class="tcHeader">
                    <div class="tcLogoArea">
                        <img src="${data.school.logo}" alt="Logo">
                    </div>
                    <div class="tcSchoolArea">
                        <h1>${data.school.schoolName}</h1>
                        <div>${data.school.address}</div>
                        <div style="font-weight:bold; margin-top:2px;">
                            UDISE: ${data.school.udise} | Recognition: Nursery to 8th
                        </div>
                    </div>
                </div>

                <div class="tcTitleArea">
                    <h2>TRANSFER CERTIFICATE</h2>
                </div>

                <table class="tcMetaTable">
                    <tr>
                        <td><span class="lbl">TC Number:</span> <strong>${data.tc.tcNumber}</strong></td>
                        <td><span class="lbl">SR Number:</span> <strong>${data.tc.srNumber || '-'}</strong></td>
                    </tr>
                </table>

                <table class="tcInfoTable">
                    <tr>
                        <td class="lbl">Student Name</td>
                        <td><strong>${data.student.studentName}</strong></td>
                        <td class="lbl">Father Name</td>
                        <td>${data.student.fatherName}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Mother Name</td>
                        <td>${data.student.motherName}</td>
                        <td class="lbl">Father Occupation</td>
                        <td>${data.student.fatherOccupation || '-'}</td>
                    </tr>
                    <tr>
                        <td class="lbl">PEN Number</td>
                        <td>${data.student.penNumber || '-'}</td>
                        <td class="lbl">Student ID</td>
                        <td>${data.student.studentId}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Class Last Studied</td>
                        <td><strong>Class ${lastCls}</strong></td>
                        <td class="lbl">Blood Group</td>
                        <td>${data.student.bloodGroup || '-'}</td>
                    </tr>
                    <tr>
                        <td class="lbl">DOB (In Figure)</td>
                        <td>${data.student.dob}</td>
                        <td class="lbl">DOB (In Words)</td>
                        <td style="font-size:11.5px;">${dobWords}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Religion</td>
                        <td>${data.student.religion || '-'}</td>
                        <td class="lbl">Category / Caste</td>
                        <td>${data.student.category || '-'} (${data.student.caste || '-'})</td>
                    </tr>
                    <tr>
                        <td class="lbl">School Last Attended</td>
                        <td colspan="3">${data.student.previousSchool}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Permanent Address</td>
                        <td colspan="3">${data.student.address}</td>
                    </tr>
                </table>

                <div class="tcSectionHeading">Academic History</div>
                
                <div class="tcAcademicWrapper">
                    <table class="tcAcademicTable">
                        <thead>
                            <tr>
                                <th width="12%">Class</th>
                                <th width="18%">Session</th>
                                <th width="20%">Date of Admission</th>
                                <th width="20%">Date of Leaving</th>
                                <th width="15%">Result</th>
                                <th width="15%">Remarks</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHtml}
                        </tbody>
                    </table>
                </div>

                <table class="tcLeavingTable">
                    <tr>
                        <td class="lbl">Date of Leaving School</td>
                        <td>${data.tc.leavingDate || '-'}</td>
                    </tr>
                    <tr>
                        <td class="lbl">Reason for Leaving School</td>
                        <td>${data.tc.leavingReason}</td>
                    </tr>
                </table>

                <div class="tcCertificateText">
                    Certified that the above information is in accordance with the school register. No change in any entry is to be made except by the authority issuing the certificate.
                </div>

                <div class="tcSignatureArea">
                    <div class="dateBox">
                        Date: <span>${data.tc.issueDate}</span>
                    </div>
                    <div class="sigBox">
                        <div class="line">_______________________</div>
                        <div class="txt">Prepared by</div>
                    </div>
                    <div class="sigBox">
                        <div class="line">_______________________</div>
                        <div class="txt">Principal (with Seal)</div>
                    </div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML("beforeend", sheetHtml);
    });
}

function executeSafePrint() {
    const printContent = document.getElementById("tcPrintContainer").innerHTML;
    
    const oldFrame = document.getElementById("printIframe");
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement("iframe");
    iframe.id = "printIframe";
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "none";
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Transfer Certificate</title>
            <style>
                @page {
                    size: A4 portrait;
                    margin: 0;
                }
                * { box-sizing: border-box; }
                html, body {
                    margin: 0;
                    padding: 0;
                    font-family: Arial, Helvetica, sans-serif;
                    background: #fff;
                    color: #000;
                    width: 210mm;
                    height: 297mm;
                }
                .tcLegalSheet {
                    width: 210mm;
                    height: 297mm;
                    max-height: 297mm;
                    box-sizing: border-box;
                    page-break-after: always;
                    break-after: page;
                    margin: 0;
                    padding: 10mm 15mm 8mm 15mm;
                    display: flex;
                    flex-direction: column;
                    justify-content: space-between;
                    overflow: hidden;
                }
                .tcLegalSheet:last-child {
                    page-break-after: avoid;
                    break-after: avoid;
                }
                .tcHeader { display: table; width: 100%; border-bottom: 2.5px solid #000; padding-bottom: 6px; margin-bottom: 8px; flex-shrink: 0; }
                .tcLogoArea { display: table-cell; vertical-align: middle; width: 14%; }
                .tcLogoArea img { width: 80px; height: 80px; object-fit: contain; }
                .tcSchoolArea { display: table-cell; vertical-align: middle; text-align: center; width: 86%; }
                .tcSchoolArea h1 { margin: 0 0 4px 0; font-size: 26px; color: #0b3c5d; font-weight: 800; text-transform: uppercase; }
                .tcSchoolArea div { font-size: 13px; color: #333; }
                .tcTitleArea { text-align: center; margin: 6px 0 10px; flex-shrink: 0; }
                .tcTitleArea h2 { display: inline-block; margin: 0; font-size: 19px; font-weight: 800; border-bottom: 2px solid #000; padding-bottom: 2px; }
                
                table { width: 100%; border-collapse: collapse; margin-bottom: 8px; background: #fff; }
                .tcMetaTable, .tcInfoTable, .tcLeavingTable { flex-shrink: 0; }
                td, th { border: 1.2px solid #000; padding: 6px 8px; font-size: 12.5px; vertical-align: middle; }
                .tcMetaTable td { font-size: 13.5px; width: 50%; font-weight: bold; }
                .lbl { font-weight: bold; background: #fafafa; }
                .tcSectionHeading { margin: 8px 0 4px; font-size: 14px; text-align: center; color: #0b3c5d; font-weight: bold; text-transform: uppercase; flex-shrink: 0; }
                
                .tcAcademicWrapper {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    margin-bottom: 8px;
                    min-height: 0;
                }
                .tcAcademicTable {
                    width: 100%;
                    height: 100%;
                    border-collapse: collapse;
                }
                .tcAcademicTable th { background: #f1f5f9; text-align: center; font-size: 12px; padding: 6px 4px; height: 28px; }
                .tcAcademicTable td { text-align: center; font-size: 12.5px; padding: 4px 6px; }

                .tcCertificateText { border: 1.2px solid #000; padding: 8px 12px; margin: 6px 0 12px; line-height: 1.4; text-align: justify; font-size: 11.5px; flex-shrink: 0; }
                .tcSignatureArea { display: table; width: 100%; margin-top: 10px; padding-bottom: 4px; flex-shrink: 0; }
                .tcSignatureArea .sigBox { display: table-cell; width: 35%; text-align: center; vertical-align: bottom; }
                .tcSignatureArea .dateBox { display: table-cell; width: 30%; text-align: center; vertical-align: bottom; font-size: 13px; font-weight: bold; }
                .tcSignatureArea .sigBox .line { margin-bottom: 5px; font-weight: bold; }
                .tcSignatureArea .sigBox .txt { font-size: 12.5px; font-weight: bold; }
            </style>
        </head>
        <body>
            ${printContent}
        </body>
        </html>
    `);
    doc.close();

    setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
    }, 400);
}
</script>
