<style>
    .admBox { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px; overflow: hidden; }
    .admHead { background: #f8fafc; padding: 10px 15px; border-bottom: 1px solid #e2e8f0; font-weight: 700; color: #0b3c5d; font-size: 13.5px; }
    
    /* 4-कॉलम डेस्कटॉप ग्रिड जो मोबाइल पर खुद 1 कॉलम बनेगा */
    .admGrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        padding: 15px;
    }
    .admGrp { display: flex; flex-direction: column; }
    .admGrp label { font-size: 11.5px; font-weight: 600; color: #475569; margin-bottom: 3px; }
    .admGrp input, .admGrp select, .admGrp textarea {
        padding: 7px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 13px;
        outline: none;
        background: #fff;
    }
    .admGrp input[readonly] { background: #f1f5f9; color: #64748b; }
    .admSpan2 { grid-column: span 2; }
    
    .admBtns { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
    .btn { padding: 9px 16px; font-size: 13px; font-weight: 600; border-radius: 4px; border: none; cursor: pointer; }
    .btnSuccess { background: #16a34a; color: #fff; }
    .btnInfo { background: #0284c7; color: #fff; }
    .btnDanger { background: #dc2626; color: #fff; }

    /* TABLET & MOBILE RESPONSIVE MEDIA QUERIES */
    @media (max-width: 900px) {
        .admGrid { grid-template-columns: repeat(2, 1fr); }
        .admSpan2 { grid-column: span 2; }
    }
    @media (max-width: 550px) {
        .admGrid { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
        .admSpan2 { grid-column: span 1; }
        .admBtns { justify-content: stretch; }
        .admBtns button { flex: 1; text-align: center; }
    }
</style>

<form id="admSingleForm" onsubmit="event.preventDefault(); submitAdmissionData();">
    <!-- 1. छात्र विवरण -->
    <div class="admBox">
        <div class="admHead">1. Student Information</div>
        <div class="admGrid">
            <div class="admGrp">
                <label>Primary Mobile *</label>
                <input type="text" id="primaryMobile" maxlength="10" placeholder="10 Digit Mobile" required>
            </div>
            <div class="admGrp">
                <label>Admission Date *</label>
                <input type="date" id="admissionDate" required>
            </div>
            <div class="admGrp">
                <label>Session</label>
                <input type="text" id="currentSession" value="2026-2027" readonly>
            </div>
            <div class="admGrp">
                <label>Student ID</label>
                <input type="text" id="studentId" readonly placeholder="APS...">
            </div>
            <div class="admGrp">
                <label>Student Full Name *</label>
                <input type="text" id="studentName" required placeholder="Full Name">
            </div>
            <div class="admGrp">
                <label>Date Of Birth *</label>
                <input type="date" id="dob" required>
            </div>
            <div class="admGrp">
                <label>Gender *</label>
                <select id="gender" required>
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="admGrp">
                <label>Blood Group</label>
                <select id="bloodGroup">
                    <option value="">Select</option>
                    <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                </select>
            </div>
            <div class="admGrp">
                <label>Student Aadhaar</label>
                <input type="text" id="studentAadhaar" maxlength="12" placeholder="12 Digit Aadhaar">
            </div>
            <div class="admGrp">
                <label>PEN Number</label>
                <input type="text" id="penNumber" placeholder="UDISE PEN">
            </div>
            <div class="admGrp">
                <label>Category</label>
                <select id="category">
                    <option value="GEN">GEN</option><option value="OBC">OBC</option>
                    <option value="SC">SC</option><option value="ST">ST</option>
                </select>
            </div>
            <div class="admGrp">
                <label>Religion</label>
                <select id="religion">
                    <option value="Hindu">Hindu</option><option value="Islam">Islam</option>
                    <option value="Buddhist">Buddhist</option><option value="Sikh">Sikh</option><option value="Christian">Christian</option>
                </select>
            </div>
            <div class="admGrp">
                <label>Caste</label>
                <input type="text" id="caste" placeholder="Caste">
            </div>
            <div class="admGrp">
                <label>Student Photo</label>
                <div style="display:flex; gap:5px;">
                    <input type="file" id="photoFile" accept="image/*" style="padding:2px; font-size:11px;">
                    <button type="button" class="btn btnInfo" style="padding:3px 8px; font-size:11px;" onclick="uploadPhotoNow()">Upload</button>
                </div>
                <input type="hidden" id="studentPhotoLink">
                <small id="photoStatus" style="color:#666; font-size:11px; margin-top:2px;">No photo uploaded</small>
            </div>
        </div>
    </div>

    <!-- 2. शैक्षणिक विवरण -->
    <div class="admBox">
        <div class="admHead">2. Academic Information</div>
        <div class="admGrid">
            <div class="admGrp">
                <label>Admission Class *</label>
                <select id="currentClass" required onchange="fetchRollNumber()">
                    <option value="Nursery">Nursery</option>
                    <option value="LKG">LKG</option>
                    <option value="UKG">UKG</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
            <div class="admGrp">
                <label>Section *</label>
                <select id="section" required>
                    <option value="A" selected>A</option>
                </select>
            </div>
            <div class="admGrp">
                <label>Roll Number</label>
                <input type="text" id="rollNumber" readonly placeholder="Auto">
            </div>
            <div class="admGrp">
                <label>Status</label>
                <select id="studentStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
            <div class="admGrp">
                <label>SR Number (खाली छोड़ें या खुद भरें)</label>
                <input type="text" id="srNumber" placeholder="Leave blank for Auto +1">
            </div>
            <div class="admGrp">
                <label>Previous School Status</label>
                <select id="previousSchoolStatus">
                    <option value="Non Schooling">Non Schooling</option>
                    <option value="Same School">Same School</option>
                    <option value="Other School">Other School</option>
                </select>
            </div>
            <div class="admGrp admSpan2">
                <label>Previous School Details & UDISE</label>
                <input type="text" id="previousSchoolDetails" placeholder="School Name, UDISE">
            </div>
        </div>
    </div>

    <!-- 3. अभिभावक व पता -->
    <div class="admBox">
        <div class="admHead">3. Parent & Address Details</div>
        <div class="admGrid">
            <div class="admGrp">
                <label>Father Name *</label>
                <input type="text" id="fatherName" required placeholder="Father Name">
            </div>
            <div class="admGrp">
                <label>Father Occupation</label>
                <input type="text" id="fatherOccupation" placeholder="Occupation">
            </div>
            <div class="admGrp">
                <label>Father Aadhaar</label>
                <input type="text" id="fatherAadhaar" maxlength="12" placeholder="Aadhaar">
            </div>
            <div class="admGrp">
                <label>Mother Name *</label>
                <input type="text" id="motherName" required placeholder="Mother Name">
            </div>
            <div class="admGrp">
                <label>Mother Occupation</label>
                <input type="text" id="motherOccupation" placeholder="Occupation">
            </div>
            <div class="admGrp">
                <label>Mother Aadhaar</label>
                <input type="text" id="motherAadhaar" maxlength="12" placeholder="Aadhaar">
            </div>
            <div class="admGrp">
                <label>Alternate Mobile</label>
                <input type="text" id="alternateMobile" maxlength="10" placeholder="Mobile">
            </div>
            <div class="admGrp">
                <label>Email</label>
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="admGrp admSpan2">
                <label>Permanent Address *</label>
                <textarea id="fullAddress" rows="2" placeholder="Village, Post, Dist" required></textarea>
            </div>
        </div>
    </div>

    <!-- 4. वास्तविक स्कूल विवरण (केवल ID कार्ड हेतु) -->
    <div class="admBox">
        <div class="admHead">4. Actual School Affiliation (केवल ID Card हेतु - वैकल्पिक)</div>
        <div class="admGrid">
            <div class="admGrp admSpan2">
                <label>Actual School Name & Address</label>
                <input type="text" id="actualSchoolName" placeholder="यदि छात्र दूसरे स्कूल का है (उदा. ABC Academy, Gorakhpur)">
            </div>
            <div class="admGrp admSpan2">
                <label>Actual School Logo Link</label>
                <input type="text" id="actualSchoolLogo" placeholder="https://.../logo.png">
            </div>
        </div>
    </div>

    <div class="admBtns">
        <button type="button" class="btn btnDanger" onclick="navigateModule('admission', 'New Admission')">Reset</button>
        <button type="button" class="btn btnInfo" onclick="previewCurrentForm()">👁️ Print Preview</button>
        <button type="submit" class="btn btnSuccess">💾 Final Submit</button>
    </div>
</form>

<script>
    (function() {
        document.getElementById("admissionDate").value = new Date().toISOString().split('T')[0];
        fetchRollNumber();
    })();

function fetchRollNumber() {
    const cls = document.getElementById("currentClass").value;
    const sec = document.getElementById("section").value;

    fetch(`${SCRIPT_URL}?action=getAdmissionInit&className=${encodeURIComponent(cls)}&section=${encodeURIComponent(sec)}`)
    .then(r => r.json())
    .then(res => {
        if(res.status === "SUCCESS") {
            document.getElementById("studentId").value = res.studentId;
            // रोल नंबर अगर ऑब्जेक्ट हो तो उसका मान निकालें, वर्ना सीधा असाइन करें
            const finalRoll = (typeof res.rollNumber === 'object' && res.rollNumber !== null) 
                              ? res.rollNumber.rollNumber 
                              : res.rollNumber;
            document.getElementById("rollNumber").value = finalRoll || 1;
            document.getElementById("srNumber").placeholder = `Auto: ${res.nextSR} (या खुद लिखें)`;
        }
    });
}

    function uploadPhotoNow() {
        const fileInput = document.getElementById("photoFile");
        if(!fileInput.files || !fileInput.files[0]) {
            alert("कृपया पहले फोटो फ़ाइल चुनें!");
            return;
        }

        const sId = document.getElementById("studentId").value || "TempID";
        const sName = document.getElementById("studentName").value.trim() || "Student";
        const status = document.getElementById("photoStatus");
        status.innerText = "Uploading photo...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const params = new URLSearchParams();
            params.append("action", "uploadPhoto");
            params.append("base64", e.target.result);
            params.append("fileName", `${sId}_${sName}_Photo`);

            fetch(SCRIPT_URL, { method: "POST", body: params })
            .then(r => r.json())
            .then(res => {
                if(res.status === "SUCCESS") {
                    document.getElementById("studentPhotoLink").value = res.thumbnail;
                    status.innerText = "✅ Uploaded!";
                    status.style.color = "green";
                } else {
                    alert("Upload error: " + res.message);
                }
            })
            .catch(err => alert("Upload error: " + err.message));
        };
        reader.readAsDataURL(fileInput.files[0]);
    }

    function getFormDataJson() {
        return {
            primaryMobile: document.getElementById("primaryMobile").value.trim(),
            admissionDate: document.getElementById("admissionDate").value,
            currentSession: document.getElementById("currentSession").value.trim(),
            studentId: document.getElementById("studentId").value.trim(),
            studentName: document.getElementById("studentName").value.trim(),
            dob: document.getElementById("dob").value,
            gender: document.getElementById("gender").value,
            bloodGroup: document.getElementById("bloodGroup").value,
            studentAadhaar: document.getElementById("studentAadhaar").value.trim(),
            penNumber: document.getElementById("penNumber").value.trim(),
            religion: document.getElementById("religion").value,
            category: document.getElementById("category").value,
            caste: document.getElementById("caste").value.trim(),
            currentClass: document.getElementById("currentClass").value,
            section: document.getElementById("section").value,
            rollNumber: document.getElementById("rollNumber").value,
            studentStatus: document.getElementById("studentStatus").value,
            previousSchoolStatus: document.getElementById("previousSchoolStatus").value,
            previousSchoolDetails: document.getElementById("previousSchoolDetails").value.trim(),
            srNumber: document.getElementById("srNumber").value.trim(),
            alternateMobile: document.getElementById("alternateMobile").value.trim(),
            email: document.getElementById("email").value.trim(),
            fatherName: document.getElementById("fatherName").value.trim(),
            fatherEducation: "",
            fatherOccupation: document.getElementById("fatherOccupation").value.trim(),
            fatherAadhaar: document.getElementById("fatherAadhaar").value.trim(),
            motherName: document.getElementById("motherName").value.trim(),
            motherEducation: "",
            motherOccupation: document.getElementById("motherOccupation").value.trim(),
            motherAadhaar: document.getElementById("motherAadhaar").value.trim(),
            guardianName: "", guardianEducation: "", guardianOccupation: "", guardianAadhaar: "",
            fullAddress: document.getElementById("fullAddress").value.trim(),
            studentPhotoLink: document.getElementById("studentPhotoLink").value.trim(),
            actualSchoolName: document.getElementById("actualSchoolName").value.trim(),
            actualSchoolLogo: document.getElementById("actualSchoolLogo").value.trim()
        };
    }

    function submitAdmissionData() {
        const d = getFormDataJson();
        if(!d.primaryMobile || !d.studentName || !d.fatherName) {
            alert("कृपया सभी अनिवार्य फ़ील्ड्स (*) भरें!");
            return;
        }

        const params = new URLSearchParams();
        params.append("action", "saveAdmission");
        params.append("data", JSON.stringify(d));

        fetch(SCRIPT_URL, { method: "POST", body: params })
        .then(r => r.json())
        .then(res => {
            if(res.status === "SUCCESS") {
                alert(`✅ प्रवेश सफलतापूर्वक सुरक्षित!\nStudent ID: ${res.studentId}\nSR Number: ${res.srNumber}`);
                if(confirm("क्या आप एडमिशन फ़ॉर्म प्रिंट करना चाहते हैं?")) {
                    printFormLayout(res.savedData, "ADMITTED");
                }
                navigateModule('admission', 'New Admission');
            } else {
                alert("Error: " + res.message);
            }
        })
        .catch(err => alert("Saving failed: " + err.message));
    }

    function previewCurrentForm() {
        printFormLayout(getFormDataJson(), "PREVIEW");
    }

    function printFormLayout(d, status) {
        const pImg = d.studentPhotoLink ? `<img src="${d.studentPhotoLink}" style="width:85px; height:105px; object-fit:cover;">` : `<div style="width:85px; height:105px; border:1px dashed #777;">Photo</div>`;
        const w = window.open("", "_blank");
        w.document.write(`
            <html><head><title>${d.studentId || 'Form'}</title>
            <style>
                @page { size: A4; margin: 10mm; }
                body { font-family: Arial, sans-serif; font-size: 13px; }
                .table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                .table td { border: 1px solid #444; padding: 6px 8px; }
                .lbl { background: #f0f0f0; font-weight: bold; width: 22%; }
            </style></head><body>
            <div style="text-align:center; border-bottom: 2px solid #0b3c5d; padding-bottom: 6px;">
                <h2 style="margin:0; color:#0b3c5d;">AMBEDKAR PUBLIC SCHOOL</h2>
                <div>Madhopur, Campierganj, Gorakhpur | Session: ${d.currentSession}</div>
                <h4 style="margin:6px 0 0;">STUDENT ADMISSION FORM (${status})</h4>
            </div>
            <table class="table">
                <tr><td class="lbl">Student ID</td><td><strong>${d.studentId}</strong></td><td class="lbl">SR Number</td><td><strong>${d.srNumber || '-'}</strong></td></tr>
                <tr><td class="lbl">Student Name</td><td><strong>${d.studentName}</strong></td><td class="lbl">Class - Section</td><td>${d.currentClass} - ${d.section}</td></tr>
                <tr><td class="lbl">DOB / Gender</td><td>${d.dob} (${d.gender})</td><td class="lbl">Roll Number</td><td>${d.rollNumber || '-'}</td></tr>
                <tr><td class="lbl">Father Name</td><td>${d.fatherName}</td><td class="lbl">Mother Name</td><td>${d.motherName}</td></tr>
                <tr><td class="lbl">Mobile</td><td>${d.primaryMobile}</td><td class="lbl">Address</td><td>${d.fullAddress}</td></tr>
            </table>
            <div style="margin-top:50px; display:flex; justify-content:space-between; text-align:center;">
                <div style="width:200px; border-top:1px solid #000;">Parent Sign</div>
                <div style="width:200px; border-top:1px solid #000;">Principal Sign</div>
            </div>
            <script>window.print();<\/script></body></html>
        `);
        w.document.close();
    }
</script>
